<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>敲一下！｜FanGame</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8e9c9;color:#302318;font-family:system-ui,sans-serif;overflow:hidden}main{height:100dvh;min-height:300px;max-width:520px;margin:auto;display:flex;flex-direction:column;padding:20px 22px 16px;gap:12px;overflow:hidden}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;letter-spacing:-2px;margin:0}button,.upload{border:2px solid #302318;border-radius:99px;background:#fff8e9;padding:10px 16px;font:700 14px system-ui;color:inherit;cursor:pointer;box-shadow:0 3px 0 #302318}button:active,.upload:active{transform:translateY(2px);box-shadow:0 1px 0 #302318}.upload{background:#ffc349;display:inline-block}#stage{position:relative;flex:1;min-height:140px;width:100%;border:0;background:transparent;box-shadow:none;padding:0;touch-action:manipulation;user-select:none;cursor:pointer;overflow:visible}#stage:active{transform:none}.floor{position:absolute;left:12%;right:12%;height:22px;background:#d6bc91;border-radius:50%;top:74%}.body{position:absolute;width:110px;height:100px;border:4px solid #302318;border-radius:50% 50% 20% 20%;background:#ee795a;left:50%;top:69%;transform:translate(-50%,-10%)}#head{position:absolute;left:50%;top:48%;width:clamp(120px,48vw,220px);aspect-ratio:1;transform:translate(-50%,-50%);transform-origin:50% 90%;border:5px solid #302318;border-radius:50%;background:#ffd075;overflow:hidden;box-shadow:0 8px 0 #30231820}#face{width:100%;height:100%;object-fit:cover;display:none;pointer-events:none}#default{width:100%;height:100%}#hammer{position:absolute;width:140px;height:170px;left:calc(50% + 26px);top:calc(48% - 175px);transform-origin:85% 92%;transform:rotate(32deg);pointer-events:none;z-index:3}#burst{position:absolute;top:calc(48% - 115px);left:50%;font-size:38px;font-weight:1000;color:#d84d30;transform:translateX(-50%) scale(0);pointer-events:none;z-index:4;white-space:nowrap}.hint{text-align:center;font-size:17px;font-weight:700;margin:0}.controls{text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.note{text-align:center;font-size:11px;opacity:.65;margin:0}#status{text-align:center;min-height:18px;font-size:12px;margin:0}#crop{display:none;align-items:center;gap:8px;justify-content:center;font-size:12px}input[type=range]{width:100px;min-width:0;accent-color:#d4613b}#file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}#count{font-size:13px;background:#302318;color:#fff8e9;border-radius:30px;padding:7px 12px;font-variant-numeric:tabular-nums}#reset{font-size:12px;padding:8px 12px}
@media(max-height:450px){main{padding:10px 20px;gap:5px}h1{font-size:22px}#head{width:120px}#hammer{width:100px;height:120px;top:calc(48% - 115px)}.body{width:80px;height:55px}.hint{font-size:13px}.upload,button{padding:6px 12px}.note{font-size:10px}}
</style></head><body><main><header><h1>敲一下！</h1><span id="count">0 下</span></header>
<button id="stage" aria-label="敲頭像一下"><span class="floor"></span><span class="body"></span><span id="head"><svg id="default" viewBox="0 0 200 200" aria-hidden="true"><path d="M43 70q20-22 35-6M124 64q20-16 36 6" fill="none" stroke="#302318" stroke-width="7" stroke-linecap="round"/><ellipse cx="67" cy="96" rx="9" ry="13" fill="#302318"/><ellipse cx="138" cy="96" rx="9" ry="13" fill="#302318"/><path d="M79 140q22 19 43 0" stroke="#302318" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="45" cy="124" rx="18" ry="9" fill="#ec9972"/><ellipse cx="157" cy="124" rx="18" ry="9" fill="#ec9972"/></svg><img id="face" alt="你選擇的頭像"></span>
<svg id="hammer" viewBox="0 0 140 170" aria-hidden="true"><rect x="75" y="45" width="23" height="116" rx="10" fill="#b57945" stroke="#302318" stroke-width="5"/><path d="M81 74v65" stroke="#e5b373" stroke-width="5" stroke-linecap="round"/><rect x="9" y="14" width="120" height="62" rx="18" fill="#e8644e" stroke="#302318" stroke-width="5"/><path d="M25 26v37M112 26v37" stroke="#ffb390" stroke-width="7" stroke-linecap="round"/></svg><span id="burst">叩！</span></button>
<p class="hint">點一下，敲一下。</p><div class="controls"><label class="upload" for="file">＋ 上傳頭像</label><input id="file" type="file" accept="image/*"><button id="sound" aria-pressed="true">音效 開</button><button id="reset">重來</button></div>
<div id="crop"><label for="zoom">縮放</label><input id="zoom" type="range" min="1" max="3" step=".05" value="1"><label for="position">上下</label><input id="position" type="range" min="0" max="100" value="50"></div>
<p id="status" role="status"></p><p class="note">照片只在此頁使用，不會上傳或隨連結分享。</p></main>
<script>
const $=s=>document.querySelector(s),head=$('#head'),hammer=$('#hammer'),burst=$('#burst'),face=$('#face');
let count=0,sound=true,audio,version=0;
function playSound(){if(!sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(65,t+.13);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.17)}catch{}}
function animate(el,frames,options){el.getAnimations().forEach(a=>a.cancel());return el.animate(frames,options)}
$('#stage').addEventListener('click',()=>{count++;$('#count').textContent=count+' 下';playSound();animate(hammer,[{transform:'rotate(32deg)'},{transform:'rotate(-38deg)',offset:.25},{transform:'rotate(-30deg)',offset:.4},{transform:'rotate(32deg)'}],{duration:300,easing:'ease-out'});animate(head,[{transform:'translate(-50%,-50%) scale(1,1)'},{transform:'translate(-50%,-32%) scale(1.16,.78) rotate(-5deg)',offset:.25},{transform:'translate(-50%,-57%) scale(.94,1.07) rotate(4deg)',offset:.65},{transform:'translate(-50%,-50%) scale(1,1)'}],{duration:440});burst.textContent=['叩！','咚！','砰！'][count%3];animate(burst,[{transform:'translate(-50%,15px) scale(0)',opacity:1},{transform:'translate(-50%,-10px) scale(1.2)',opacity:1,offset:.35},{transform:'translate(-50%,-45px) scale(.9)',opacity:0}],{duration:450});});
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent='音效 '+(sound?'開':'關');$('#sound').setAttribute('aria-pressed',String(sound))};
function crop(){face.style.transform='scale('+$('#zoom').value+')';face.style.objectPosition='50% '+$('#position').value+'%'}
$('#zoom').oninput=crop;$('#position').oninput=crop;
$('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;const ticket=++version;$('#status').textContent='讀取照片中…';if(file.size>25*1024*1024){$('#status').textContent='請選擇小於 25 MB 的照片';e.target.value='';return}const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();if(ticket!==version)return;const canvas=document.createElement('canvas'),s=Math.min(1,1600/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*s));canvas.height=Math.max(1,Math.round(img.height*s));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);face.src=canvas.toDataURL('image/jpeg',.9);face.style.display='block';$('#default').style.display='none';$('#zoom').value=1;$('#position').value=50;crop();$('#crop').style.display='flex';$('#status').textContent='頭像換好了，點一下試試！'}catch{if(ticket===version)$('#status').textContent='無法讀取這張照片，請試 JPG、PNG 或 WebP。'}finally{URL.revokeObjectURL(url);e.target.value=''}};
$('#reset').onclick=()=>{version++;count=0;$('#count').textContent='0 下';face.removeAttribute('src');face.style.display='none';$('#default').style.display='block';$('#crop').style.display='none';$('#status').textContent='';head.getAnimations().forEach(a=>a.cancel());hammer.getAnimations().forEach(a=>a.cancel());burst.getAnimations().forEach(a=>a.cancel())};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&audio)audio.suspend().catch(()=>{})});
</script></body></html>
