.rule{font-size:11px;color:#688057;background:#edf3df;padding:8px 12px;border-radius:10px;margin-bottom:9px}.sheet-guide{margin:6px 0 0;font-size:12px;line-height:1.5;font-weight:750;color:#456042}.sheet-guide[hidden]{display:none}</style><main class="phone"><header class="head"><div class="avatar">🐰</div><div><b>親愛的 ♡</b><div class="status" id="status">● 在線上</div></div><span class="dots">♡</span><span class="meter" id="meter">傳錯剩 3/3 · 默契 100</span></header><div class="gamehud"><div class="clockbox" id="clockbox"><div class="hudlabel">本張等待 · <span id="naglabel">催促 0 / 4</span></div><div class="hudvalue" id="clock">25 秒</div><div class="track"><div id="timebar"></div></div></div><div class="chancebox" id="chancebox"><div class="hudlabel">整場傳錯機會 · 換關不補回</div><div class="hudvalue" id="chances">♥ ♥ ♥ <small>剩 3 次</small></div><div class="hudsub" id="chancehint">傳錯才扣機會</div></div></div><div class="chat" id="chat"><div class="date">今天 · 寶貝的貼圖測驗</div></div><div class="composer"><button id="compose">傳送一張專屬貼圖… <b>☺ ＋</b></button></div><section class="sheet" id="sheet"><div class="handle" id="handle"><div class="bar"></div><div class="sheettitle">貼圖組合區 <span id="round">向上滑，開始拼貼 ↑</span></div><p class="sheet-guide" id="sheet-guide" aria-live="polite" hidden>快找出貼圖元素，符合寶貝要求!!!</p></div><div class="body"><div class="rule" id="rule"></div><div class="stagewrap"><canvas id="stage" width="600" height="600"></canvas><div class="empty" id="empty">選幾個元素，拼出寶貝的貼圖</div></div><div class="tools"><label>大小 <input id="size" aria-label="元素大小" type="range" min="30" max="240" value="100"></label><label>角度 <input id="rotation" aria-label="元素旋轉" type="range" min="-180" max="180" value="0"></label><button id="front">置頂</button><button id="remove">刪除</button><button id="clear">重拼</button></div><div class="tabs" id="tabs"></div><div class="tray" id="tray"></div><button class="send" id="send">傳給寶貝 ↗</button><p class="hint">拖曳安排位置 · 點選後縮放旋轉 · 下滑收起，看聊天</p></div></section><div class="toast" id="toast"><div class="avatar">🐰</div><div><b>親愛的 ♡ · 新訊息</b><p id="toasttext"></p></div></div><div class="end" id="end" hidden><div class="card"><div id="endemoji" style="font-size:45px">💔</div><h1 id="endtitle"></h1><div class="score" id="finalscore"></div><p id="endtext"></p><button id="restart">重新談一次戀愛 ↻</button><button id="readchat" style="background:#edf1e8;color:#687b65">看聊天紀錄</button></div></div></main><script>
const $=id=>document.getElementById(id),S=$('stage');
const groups={'主角':['🐱','🐻','🐰','🐸','🐶','🐼','😎','🥹','😭','😴','😡','🤩'],'手勢':['✌️','👍','👋','🙏','💪','🫶','👊','🤘','👌','☝️','👐','👏'],'裝飾':['❤️','💖','⭐','✨','💧','💤','🔥','💢','🎉','🌸','☀️','💬']};
const levels=[{text:'今天也要一起加油！幫我做這張 💚',p:[['🐻',150,155,185,0],['💪',235,173,75,-15],['✨',72,65,55,-15]]},{text:'耶！週末終於來了～換這個！',p:[['🐰',151,162,180,0],['✌️',231,116,80,15],['❤️',78,66,65,-20]]},{text:'我現在的心情……你拼得出來嗎？',p:[['😭',155,150,170,-12],['💧',239,185,55,-15],['💬',75,66,65,0]]},{text:'晚安～幫我拼一張睡覺貼圖 💤',p:[['🐱',145,165,185,15],['💤',228,69,75,-12],['⭐',66,89,55,-15]]},{text:'最後這張！今天的你超厲害！',p:[['🐸',150,158,175,0],['👑',150,56,85,0],['🎉',67,157,70,-25],['❤️',239,143,65,20]]}];groups['裝飾'].push('👑');function draw(c,ps,sel=-1){const ctx=c.getContext('2d');ctx.clearRect(0,0,600,600);ctx.scale(2,2);ps.forEach((p,i)=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r*Math.PI/180);ctx.font=`${p.s}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.e,0,0);if(i===sel){ctx.strokeStyle='#6f963d';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.strokeRect(-p.s*.55,-p.s*.55,p.s*1.1,p.s*1.1)}ctx.restore()});ctx.setTransform(1,0,0,1,0,0)}
function score(){let used=new Set(),sum=0;for(let [e,x,y,s,r] of levels[round].p){let best=-1,bs=0;pieces.forEach((p,i)=>{if(p.e!==e||used.has(i))return;let dr=Math.abs(p.r-r)%360;dr=Math.min(dr,360-dr);let v=Math.max(0,1-Math.hypot(p.x-x,p.y-y)/145)*.65+Math.max(0,1-Math.abs(p.s-s)/s)*.25+Math.max(0,1-dr/180)*.1;if(v>bs){bs=v;best=i}});if(best>=0)used.add(best);sum+=bs}return Math.max(0,Math.round(sum/levels[round].p.length*100-Math.max(0,pieces.length-levels[round].p.length)*12))}

const WAIT_MS=25000,standards=[0,90,90,90,90];
function ruleText(){return round===0?'熊熊熱身：選齊指定元素就過關':`第 ${round+1} 關：相似度達 ${standards[round]}% 過關`}
function passes(n){if(round>0)return n>=standards[round];let needed=levels[round].p.map(t=>t[0]),have=pieces.map(p=>p.e);return needed.every(e=>{let i=have.indexOf(e);if(i<0)return false;have.splice(i,1);return true})}
function passReply(n){if(round===0)return n<85?'其實差滿多的……但元素都有，好啦這次給你過。寶貝，熊熊只是熱身喔，接下來每張都要 90% 才能過關 ♡':'寶貝，第一張就這麼用心！熊熊熱身結束，接下來每張都要 90% 喔。';if(round<4)return n<90?`還有一點不像，但這次先讓你過。下一張我要 ${standards[round+1]}%，不要以為每次都能混過去喔。`:`${pickReply('pass')} 下一張我要 ${standards[round+1]}% 喔。`;return pickReply('pass')}
let round=0,pieces=[],selected=-1,drag=null,playing=false,dead=false,penalty=0,total=0,timers=[],toastTimer,pressY=0,wasOpen=false,attempts=0,introShown=false;
const stories=[['剛下班，累到快融化了 🫠','寶貝，傳張加油的貼圖給我嘛。這張你有嗎？'],['耶！週末終於可以見面了！','寶貝這張你有嗎？我想跟你一起比耶 ❤️'],['你剛剛是不是已讀我……','寶貝，用這張哄我。我就原諒你 🥺'],['好睏喔，想抱著你睡。','寶貝，這張晚安貼圖你有嗎？'],['今天跟你在一起好開心。','最後一張，寶貝你一定有對不對？♡']];
const replies={
wait:[
'寶貝，一張貼圖而已，你讓我等得像在等你回心轉意。',

],

]};
let replyBags={},waitElapsed=0,patienceTimer,nagCount=0,timeoutBreakup=false;
function pickReply(kind){let bag=replyBags[kind];if(!bag||!bag.length){bag=[...replies[kind]];for(let i=bag.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}replyBags[kind]=bag}return bag.pop()}
function patienceTick(){if(playing&&!dead){waitElapsed+=1000;if(waitElapsed>=WAIT_MS){waitElapsed-=WAIT_MS;nagCount++;penalty+=3;updateMeter();if(nagCount<4){message(pickReply('wait'));note(`催促 ${nagCount}/4 · 默契分 −3`)}else{playing=false;dead=true;timeoutBreakup=true;stop();$('send').disabled=true;sheet(false);message('寶貝，我已經等你四次了。看來你不愛我，分手吧。');$('status').textContent='離線';note('親愛的已離線');later(()=>{$('status').textContent='已封鎖';note('對方已封鎖你，無法傳送訊息。');$('compose').disabled=true;$('compose').textContent='你已無法傳送訊息';finish(false,pieces.length?score():0)},1600)}}}updateHud();patienceTimer=setTimeout(patienceTick,1000)}
function updateMeter(){$('meter').textContent=`傳錯剩 ${3-attempts}/3 · 默契 ${Math.max(0,100-penalty)}`;updateHud()}
function updateHud(){let seconds=Math.max(0,WAIT_MS/1000-Math.floor(waitElapsed/1000));$('naglabel').textContent=`催促 ${nagCount} / 4`;$('clock').textContent=dead?'聊天已結束':playing?`${seconds} 秒`: '等待回覆…';$('timebar').style.width=(dead?0:seconds/(WAIT_MS/1000)*100)+'%';$('clockbox').classList.toggle('urgent',nagCount>=3||seconds<=5);let left=Math.max(0,3-attempts);$('chances').textContent='♥ '.repeat(left)+'♡ '.repeat(3-left)+`剩 ${left} 次`;$('chancehint').textContent=`已傳錯 ${attempts} / 3 次 · 等待不扣此機會`;$('chancebox').classList.toggle('urgent',left<=1)}


function later(fn,ms){let id=setTimeout(fn,ms);timers.push(id);return id}function stop(){timers.forEach(clearTimeout);timers=[]}
function scroll(){let c=$('chat');c.scrollTop=c.scrollHeight}
function message(text,me=false){let line=document.createElement('div');line.className='line'+(me?' me':'');let b=document.createElement('div');b.className='bubble';b.textContent=text;if(!me){let a=document.createElement('div');a.className='mini';a.textContent='🐰';line.append(a)}line.append(b);$('chat').append(line);scroll();if(!me&&$('sheet').classList.contains('open'))notify(text)}

function sticker(ps,me){let line=document.createElement('div');line.className='line'+(me?' me':'');if(!me){let a=document.createElement('div');a.className='mini';a.textContent='🐰';line.append(a)}let c=document.createElement('canvas');c.width=c.height=600;c.className='sticker';draw(c,ps);line.append(c);let t=document.createElement('span');t.className='time';t.textContent=me?'已讀':'親愛的';line.append(t);$('chat').append(line);scroll()}
function update(){draw(S,pieces,selected);$('empty').hidden=pieces.length>0;let p=pieces[selected];if(p){$('size').value=p.s;$('rotation').value=p.r}}
function startRound(){stop();if(!introShown)$('sheet-guide').hidden=true;$('rule').textContent=ruleText();nagCount=0;waitElapsed=0;playing=false;pieces=[];selected=-1;update();sheet(false);$('send').disabled=true;$('status').textContent='正在輸入…';later(()=>message(stories[round][0]),600);later(()=>{message(stories[round][1]);if(round===1)message('寶貝，現在正式開始囉！接下來每張都要 90%，位置、大小跟角度都要用心喔。');note(ruleText());sticker(levels[round].p.map(([e,x,y,s,r])=>({e,x,y,s,r})),false);playing=true;$('send').disabled=false;$('status').textContent='● 在線上';if($('sheet').classList.contains('open'))notify('寶貝這張你有嗎？快看我傳的貼圖 ♡');if(!introShown){introShown=true;$('sheet-guide').hidden=false;later(()=>{if(!$('sheet').classList.contains('open'))$('sheet').classList.add('peek')},650)}},1600)}
function difference(){let targets=levels[round].p,used=new Set(),matched=[];for(let t of targets){let i=pieces.findIndex((p,i)=>p.e===t[0]&&!used.has(i));if(i<0)return `寶貝，少了 ${t[0]} 啦！再看一下這張。`;used.add(i);matched.push([pieces[i],t])}let extra=pieces.find((p,i)=>!used.has(i));if(extra)return `多了一個 ${extra.e}，我的這張沒有這個喔。`;let worst=matched.map(([p,t])=>({p,t,d:Math.hypot(p.x-t[1],p.y-t[2])})).sort((a,b)=>b.d-a.d)[0];if(worst.d>14){let dx=worst.t[1]-worst.p.x,dy=worst.t[2]-worst.p.y;return `${worst.p.e} 的位置差了一點，要往${Math.abs(dx)>Math.abs(dy)?(dx>0?'右':'左'):(dy>0?'下':'上')}移一些喔。`}let size=matched.slice().sort((a,b)=>Math.abs(b[0].s-b[1][3])/b[1][3]-Math.abs(a[0].s-a[1][3])/a[1][3])[0];if(Math.abs(size[0].s-size[1][3])>8)return `${size[0].e} 要再${size[0].s<size[1][3]?'大':'小'}一點點，寶貝仔細看～`;return '角度還差了一點點喔，轉一轉，再看看跟我的像不像？'}
function tab(name){$('tabs').innerHTML='';Object.keys(groups).forEach(n=>{let b=document.createElement('button');b.textContent=n;b.className=n===name?'active':'';b.onclick=()=>tab(n);$('tabs').append(b)});$('tray').innerHTML='';groups[name].forEach(e=>{let b=document.createElement('button');b.className='piece';b.textContent=e;b.setAttribute('aria-label','加入 '+e);b.onclick=()=>{if(!playing)return;pieces.push({e,x:150,y:150,s:name==='主角'?180:70,r:0});selected=pieces.length-1;update()};$('tray').append(b)})}
function pt(e){let r=S.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*300,y:(e.clientY-r.top)/r.height*300}}
S.onpointerdown=e=>{if(!playing)return;const p=pt(e);selected=pieces.findLastIndex(q=>Math.hypot(p.x-q.x,p.y-q.y)<q.s*.58);if(selected>=0){drag={x:p.x-pieces[selected].x,y:p.y-pieces[selected].y};S.setPointerCapture(e.pointerId)}update()};S.onpointermove=e=>{if(!drag)return;let p=pt(e),q=pieces[selected];q.x=Math.max(15,Math.min(285,p.x-drag.x));q.y=Math.max(15,Math.min(285,p.y-drag.y));update()};S.onpointerup=S.onpointercancel=()=>drag=null;
$('size').oninput=e=>{if(pieces[selected]&&playing){pieces[selected].s=+e.target.value;update()}};$('rotation').oninput=e=>{if(pieces[selected]&&playing){pieces[selected].r=+e.target.value;update()}};$('remove').onclick=()=>{if(selected>=0&&playing){pieces.splice(selected,1);selected=-1;update()}};$('clear').onclick=()=>{if(playing){pieces=[];selected=-1;update()}};$('front').onclick=()=>{if(selected>=0&&playing){pieces.push(pieces.splice(selected,1)[0]);selected=pieces.length-1;update()}};
$('compose').onclick=()=>{if(!dead)sheet(true)};$('toast').onclick=()=>sheet(false);
$('handle').onpointerdown=e=>{pressY=e.clientY;wasOpen=$('sheet').classList.contains('open');$('handle').setPointerCapture(e.pointerId)};$('handle').onpointermove=e=>{if(!$('handle').hasPointerCapture(e.pointerId))return;let diff=e.clientY-pressY;if(Math.abs(diff)>10){$('sheet').style.transition='none';$('sheet').style.transform=`translateY(${Math.max(0,Math.min($('sheet').offsetHeight-64,(wasOpen?0:$('sheet').offsetHeight-64)+diff))}px)`}};$('handle').onpointerup=e=>{let d=e.clientY-pressY;$('sheet').style.transition='';$('sheet').style.transform='';sheet(Math.abs(d)<15?!wasOpen:d<0)};$('handle').onpointercancel=()=>{$('sheet').style.transition='';$('sheet').style.transform=''};
function finish(win,n){dead=true;playing=false;sheet(false);$('endtitle').textContent=win?'寶貝，我們也太有默契了吧！':'你已被親愛的封鎖';$('endemoji').textContent=win?'💞':'💔';$('finalscore').textContent=n+'%';$('endtext').textContent=win?`五張貼圖挑戰完成！累積失誤 ${attempts}/3 次，等待扣分 ${penalty}，最終默契分 ${Math.max(0,Math.round(total/5)-penalty)}。`:`這張貼圖的相似度 ${n}%，${round===0?'需要選齊指定元素才能過關':`本關需要達到 ${standards[round]}% 才能過關`}。累積失誤 ${attempts}/3 次，等待扣分 ${penalty}，最終默契分 ${Math.max(0,n-penalty)}。`;if(timeoutBreakup)$('endtext').textContent=`同一張貼圖等了四次，對方的耐心已用完。累積等待扣分 ${penalty}。`;updateHud();$('end').hidden=false}
$('send').onclick=()=>{if(!playing)return;if(!pieces.length){notify('先拼一張貼圖，再傳給寶貝吧！');return}playing=false;stop();$('send').disabled=true;let n=score(),passed=passes(n);if(!passed)attempts++;updateMeter();selected=-1;update();sheet(false);sticker(pieces.map(p=>({...p})),true);note(`貼圖相似度 ${n}% · 等待扣分 ${penalty}`);$('status').textContent='正在輸入…';if(!passed&&attempts<3){let feedback=difference();later(()=>message(pickReply('miss')),1000);later(()=>{sticker(levels[round].p.map(([e,x,y,s,r])=>({e,x,y,s,r})),false);message(feedback)},2400);later(()=>{message(`寶貝你真的有嗎？整場只剩 ${3-attempts} 次機會，我的耐心不會重新來過喔。`);note(`累積第 ${attempts} 次未達標 · 整場剩 ${3-attempts} 次機會`);playing=true;$('send').disabled=false;$('status').textContent='● 在線上';sheet($('sheet').classList.contains('open'));},3900)}else if(!passed){later(()=>message('寶貝，整場三次機會都用完了。每次我都說服自己再相信你一次……'),1000);later(()=>message('看來寶貝不愛我，分手吧。'),2600);later(()=>{$('status').textContent='離線';note('親愛的已離線')},4000);later(()=>{$('status').textContent='已封鎖';note('對方已封鎖你，無法傳送訊息。');$('compose').disabled=true;$('compose').textContent='你已無法傳送訊息';finish(false,n)},5400)}else{total+=n;later(()=>{message(passReply(n));$('status').textContent='● 在線上'},1000);if(round===4)later(()=>finish(true,Math.round(total/5)),3000);else later(()=>{round++;startRound()},3200)}};
$('restart').onclick=()=>{stop();clearTimeout(patienceTimer);waitElapsed=0;nagCount=0;timeoutBreakup=false;playing=false;replyBags={};round=0;attempts=0;penalty=total=0;dead=false;introShown=false;$('end').hidden=true;$('compose').disabled=false;$('compose').innerHTML='傳送一張專屬貼圖… <b>☺ ＋</b>';$('chat').innerHTML='<div class="date">今天 · 寶貝的貼圖測驗</div>';updateMeter();patienceTick();startRound()};$('readchat').onclick=()=>{$('end').hidden=true;let b=document.createElement('button');b.className='send';b.textContent='重新談一次戀愛 ↻';b.onclick=()=>$('restart').click();$('chat').append(b);scroll()};tab('主角');updateMeter();patienceTick();startRound();
</script></html>
