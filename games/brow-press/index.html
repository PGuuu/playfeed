<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee7de">
<title>按按眉心｜FanGame</title>
<link rel="stylesheet" href="./style.css">
<script src="./geometry.js" defer></script>
<script src="./breathing.js" defer></script>
<script src="./game.js" defer></script>
<script src="/game-interaction.js?v=20261120" defer></script></head>
<body>
<main>
  <h1>按按眉心 股市放心</h1>
  <section class="game-panel">
  <div class="portrait-wrap">
  <div id="surface" role="button" tabindex="0" aria-label="按住眉心，放開回彈" aria-pressed="false">
    <canvas id="portrait" width="720" height="912" aria-label="照片按壓畫面"></canvas>
    <span id="point" aria-hidden="true"></span>
    <svg id="crosshair" viewBox="0 0 80 80" aria-hidden="true" hidden><circle cx="40" cy="40" r="23"/><path d="M40 4v24m0 24v24M4 40h24m24 0h24"/><circle cx="40" cy="40" r="2"/></svg>
    <svg id="finger" viewBox="0 0 160 390" aria-hidden="true">
      <defs>
        <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#bd917d"/><stop offset=".18" stop-color="#e0b7a0"/><stop offset=".48" stop-color="#f4d6bf"/><stop offset=".77" stop-color="#e7bfa7"/><stop offset="1" stop-color="#c99b83"/></linearGradient>
        <linearGradient id="nail" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7e3d6"/><stop offset="1" stop-color="#e7c5b6"/></linearGradient>
      </defs>
      <path d="M29 177 27 43C26 25 36 12 51 12S77 25 78 43l8 133 13-27c5-12 20-12 25-1l8 26c13-2 23 10 24 22l6 31c12 2 17 15 15 28l-6 57 8 78H47l-9-65c-4-21-23-36-27-59l-9-50c-2-17 14-28 27-17Z" fill="url(#skin)" stroke="#b48a752f" stroke-width="1.5"/>
      <path d="M34 47c0-14 7-24 17-24s17 10 18 24l1 22c-6 6-30 8-36 0Z" fill="url(#nail)" stroke="#cfaa973f" stroke-width="1"/>
      <path d="m34 111 34-2m-31 13 30-1m30 62 9 31m23-24 7 28m15-12 5 26" fill="none" stroke="#aa7c6240" stroke-width="2" stroke-linecap="round"/>
      <path d="M40 39c0-8 3-12 7-15" fill="none" stroke="#fff4e870" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
    <button id="wrist-button" type="button" aria-label="按住吸氣，放開吐氣" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10"/><circle cx="16" cy="16" r="3"/></svg></button>
  </div>
  <div id="breath" aria-hidden="true">
    <div class="breath-copy"><span id="breath-label" role="status" aria-live="polite"></span><span id="breath-count" aria-hidden="true"></span></div>
    <div id="breath-track" role="progressbar" aria-label="呼吸進度" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"><span id="breath-fill"></span></div>
  </div>
  </section>
  <div id="editor-controls" hidden>
    <button id="cancel" type="button" aria-label="取消調整"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <button id="zoom-out" type="button" aria-label="縮小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <input id="zoom" type="range" min=".3" max="4" step=".01" value="1" aria-label="照片縮放">
    <button id="zoom-in" type="button" aria-label="放大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
    <button id="flip" type="button" aria-label="左右翻轉" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 7v10l6-5Zm18 0v10l-6-5Z"/></svg></button>
    <button id="confirm" type="button">確認</button>
  </div>
  <div class="controls">
    <label id="upload" for="file" tabindex="0" role="button" aria-label="上傳照片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="m8 16 3-3 4 4m1-10V1m-3 3 3-3 3 3"/><circle cx="8" cy="10" r="1"/></svg><span>上傳照片</span>
    </label>
    <input id="file" type="file" accept="image/*" hidden>
    <button id="reposition" type="button" aria-label="重新設定眉心位置" title="重新設定眉心位置" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
