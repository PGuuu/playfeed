  .feed-brand { position: fixed; z-index: 5; top: 0; left: max(12px, calc((100% - 852px) / 2)); padding: 8px 12px; border-radius: 0 0 10px 10px; background: #101014; opacity: 0; transform: translateY(-100%); transition: transform .2s, opacity .2s; pointer-events: none; }

  #login-dialog { width: min(360px,calc(100% - 32px)); border: 1px solid #3a3a43; border-radius: 20px; padding: 0; color: #faf8f2; background: #19191f; }
  #login-dialog::backdrop { background: #000a; backdrop-filter: blur(4px); }
  .login-box { padding: 24px; text-align: center; }

  .login-box p { color: #aaa8b3; font-size: 14px; line-height: 1.5; }
  #phuze-widget { min-height: 54px; text-align: left; margin-top: 18px; }

  @media(prefers-reduced-motion:reduce) { .comments-sheet { animation: none; } }
  article { grid-template-rows: minmax(0, 1fr); }
  article > footer { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); left: 16px; right: 16px; z-index: 4; padding: 10px; border-radius: 14px; background: #101014ed; visibility: hidden; pointer-events: none; }
  body.controls-visible article > footer { visibility: visible; pointer-events: auto; }
  .actions { flex-wrap: wrap; justify-content: flex-end; }
  .byline { flex-shrink: 0; }
  @media(max-width:420px) { article > footer { left: 10px; right: 10px; gap: 6px; padding: 8px; } .actions { gap: 4px; } .actions button,.actions a { padding: 8px 6px; font-size: 12px; } }
  .comments-button, .reaction { position: relative; overflow: visible; }
  .action-count { position: absolute; top: -7px; right: -5px; min-width: 17px; padding: 1px 4px; border: 1px solid #55545f; border-radius: 999px; background: #373640; color: #faf8f2; font-size: 10px; font-weight: 700; line-height: 14px; font-variant-numeric: tabular-nums; pointer-events: none; }
  .reaction[aria-pressed="true"] .action-count { background: #d6fb65; color: #101014; border-color: #d6fb65; }
</style>

<script src="/auth.js"></script><script src="/recommendations.js"></script><script src="/catalog.js"></script><script type="module">
  const games = await loadPlayfeedGames();
  try { sessionStorage.setItem('playfeed:catalog:v1', JSON.stringify({ time: Date.now(), games })); } catch {}
  const playfeed = { name: 'PlayFeed', url: 'https://playfeed-gilt.vercel.app/', hash: '#creator-playfeed' };
  const profiles = new Map();
  const creatorHashes = new Map();
  for (const game of games) {
    if (!game.creator) {
      const name = game.external ? game.author : playfeed.name;
      const identity = name.trim().toLocaleLowerCase();
      const hash = creatorHashes.get(identity) || '#creator-' + game.id;
      creatorHashes.set(identity, hash);
      game.creator = game.external
        ? { name, url: game.creator_url || game.url, hash }
        : playfeed;
    }
    const { hash } = game.creator;
    if (!profiles.has(hash)) profiles.set(hash, { ...game.creator, games: [] });
    profiles.get(hash).games.push(game);
    profiles.set('#creator-' + game.id, profiles.get(hash));
  }
  const feed = document.querySelector('#feed');
  const creatorPage = document.querySelector('#creator');
  const backToFeed = document.querySelector('#back-to-feed');
  const switcher = document.querySelector('.game-switcher');
  const previousButton = document.querySelector('#previous-game');
  const nextButton = document.querySelector('#next-game');
  const feedBrand = document.querySelector('.feed-brand');
  PlayFeedAuth.onChange(user => {
    const account = document.querySelector('.account-link');
    account.textContent = user?.email ? user.email[0].toUpperCase() : '👤';
    account.title = user?.email || '登入 PlayFeed';
  });
  let visitorToken;
  try {
    visitorToken = localStorage.getItem('playfeed:visitor-token');
    if (!/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(visitorToken || '')) {
      visitorToken = crypto.randomUUID();
      localStorage.setItem('playfeed:visitor-token', visitorToken);
    }
  } catch { visitorToken = crypto.randomUUID(); }
  const controlsButton = document.querySelector('#toggle-controls');
  let navigationTimer;
  function revealNavigation(autoHide = false) {
    clearTimeout(navigationTimer);
    if (feed.hidden) return;
    document.body.classList.add('controls-visible');
    feedBrand.classList.add('visible');
    feedBrand.inert = false;
    controlsButton.setAttribute('aria-expanded', 'true');
    controlsButton.setAttribute('aria-label', '隱藏控制板');
    if (activeIndex >= 0) loadEngagement(games[activeIndex], cards[activeIndex]);
    if (autoHide) navigationTimer = setTimeout(hideNavigation, 1000);
  }
  function hideNavigation() {
    clearTimeout(navigationTimer);
    document.body.classList.remove('controls-visible');
    feedBrand.classList.remove('visible');
    feedBrand.inert = true;
    controlsButton.setAttribute('aria-expanded', 'false');
    controlsButton.setAttribute('aria-label', '顯示控制板');
  }
  controlsButton.addEventListener('click', () => {
    if (controlsButton.getAttribute('aria-expanded') === 'true') hideNavigation();
    else revealNavigation();
  });
  // Cross-origin iframe interactions move focus out of the parent document.
  window.addEventListener('blur', () => setTimeout(() => {
    if (document.activeElement?.tagName === 'IFRAME') hideNavigation();
  }, 0));
  window.addEventListener('message', event => {
    const frame = document.querySelector('article:not([hidden]) iframe');
    if (frame && event.source === frame.contentWindow && ['playfeed:start', 'game:start'].includes(event.data?.type)) hideNavigation();
  });
  const searchDialog = document.querySelector('.search-dialog');
  const searchInput = document.querySelector('#game-search');
  const reportMenu = document.querySelector('#report-menu');
  const reportDialog = document.querySelector('#report-dialog');
  const reportForm = document.querySelector('#report-form');
  const openReport = document.querySelector('#open-report');
  let reportGame;
  for (const dialog of [reportMenu, reportDialog]) {
    dialog.querySelector('[data-close]').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => {
      if (event.target !== dialog) return;
      const rect = dialog.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
    });
  }
  openReport.addEventListener('click', () => {
    reportMenu.close();
    reportForm.reset();
    document.querySelector('#report-message').textContent = '';
    reportDialog.showModal();
  });
  reportForm.addEventListener('submit', async event => {
    event.preventDefault();
    const game = reportGame;
    if (!game) return;
    const button = reportForm.querySelector('[type=submit]');
    if (button.disabled) return;
    button.disabled = true;
    document.querySelector('#report-message').textContent = '正在送出…';
    try {
      await recommendationRequest('/playfeed_game_reports', {
        method: 'POST',
        headers: { Prefer: 'return=minimal' },
        body: JSON.stringify({
          game_id: game.id,
          game_url: new URL(game.url, location.origin + "/").href,
          game_title: game.title.slice(0,300),
          visitor_token: visitorToken,
          reason: reportForm.elements.reason.value,
          details: reportForm.elements.details.value.trim(),
        }),
      }).catch(error => {
        if (error.message !== '409') throw error;
      });
      try { localStorage.setItem('playfeed:reported:' + game.id,'1'); } catch {}
      reportDialog.close();
      notifyAction('已收到檢舉，會一併處理。');
    } catch {
      document.querySelector('#report-message').textContent = '檢舉未送出，請稍後再試。';
    } finally { button.disabled = false; }
  });
  function renderSearch() {
    const query = searchInput.value.trim().normalize('NFKC').toLocaleLowerCase();
    const matches = query ? games.filter(game => {
      const text = [game.title, game.author, game.creator?.name, game.url].join(' ').normalize('NFKC').toLocaleLowerCase();
      return query.split(/\s+/).every(word => text.includes(word));
    }) : [];
    const list = document.querySelector('.search-results');
    list.replaceChildren();
    document.querySelector('#search-status').textContent = query ? (matches.length ? `${matches.length} 款遊戲` : '找不到符合的遊戲') : '';
    for (const game of matches) {
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = '#' + game.id;
      const title = document.createElement('span');
      title.textContent = game.title;
      const author = document.createElement('small');
      author.textContent = game.creator?.name || game.author;
      link.append(title, author);
      link.addEventListener('click', () => {
        searchDialog.close();
        if (location.hash === link.hash) gameFromLink();
      });
      item.append(link);
      list.append(item);
    }
  }
  document.querySelector('.search-button').addEventListener('click', () => {
    searchDialog.showModal();
    searchInput.focus();
    renderSearch();
  });
  searchInput.addEventListener('input', renderSearch);
  searchDialog.querySelector('form').addEventListener('submit', event => {
    if (event.submitter) return;
    event.preventDefault();
    document.querySelector('.search-results a')?.click();
  });
  function notifyAction(message) {
    document.querySelector('.action-status').textContent = message;
  }
  const engagementVersions = new WeakMap();
  function invalidateEngagement(card) {
    const version = (engagementVersions.get(card) || 0) + 1;
    engagementVersions.set(card, version);
    return version;
  }
  function renderSaved(card, active) {
    const button = card.querySelector('[data-kind="saved"]');
    button.setAttribute('aria-pressed', String(active));
    button.querySelector('.action-label').textContent = active ? '已儲存' : '儲存';
  }
  function renderCounts(card, counts) {
    for (const [field, selector, label] of [
      ['commentCount', '.comments-button', '留言'],
      ['saveCount', '[data-kind="saved"]', '儲存']
    ]) {
      const count = counts[field];
      if (!Number.isSafeInteger(count) || count < 0) continue;
      const button = card.querySelector(selector);
      button.querySelector('.action-count').textContent = count.toLocaleString('zh-TW');
      button.setAttribute('aria-label', label + '，共 ' + count + (field === 'commentCount' ? ' 則留言' : ' 人儲存'));
    }
  }
  async function loadEngagement(game, card) {
    const version = invalidateEngagement(card);
    const key = encodeURIComponent(new URL(game.url, location.origin + '/').href);
    try {
      // Totals are public; checking login is unnecessary to read them.
      const counts = await PlayFeedAuth.api('/api/account?action=counts&gameKey=' + key);
      if (engagementVersions.get(card) !== version) return;
      renderCounts(card, counts);
      if (!PlayFeedAuth.user) { renderSaved(card, false); return; }
      const state = await PlayFeedAuth.api('/api/account?action=state&gameKey=' + key);
      if (engagementVersions.get(card) !== version) return;
      renderSaved(card, state.saved);
      renderCounts(card, state);
    } catch {
      // Keep unavailable counts as a dash, rather than reporting a false zero.
    }
  }
  function renderProfile(profile) {
    document.querySelector('#creator-name').textContent = profile.name;
    document.querySelector('#creator-site').href = profile.url;
    const works = document.querySelector('.works');
    works.replaceChildren();
    for (const game of profile.games) {
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = '#' + game.id;
      if (game.cover) {
        const cover = document.createElement('img');
        cover.alt = '';
        cover.addEventListener('error', () => {
          cover.remove();
          link.classList.add('text-cover');
        }, { once: true });
        cover.src = game.cover;
        link.append(cover);
      } else {
        link.classList.add('text-cover');
      }
      const title = document.createElement('span');
      title.className = 'work-title';
      title.textContent = game.title;
      link.append(title);
      item.append(link);
      works.append(item);
    }
  }
  const template = document.querySelector('#card');
  const cards = games.map((game, index) => {
    const card = template.content.firstElementChild.cloneNode(true);
    card.hidden = true;
    card.setAttribute('aria-label', game.title);
    card.querySelector('.game-more').addEventListener('click', () => {
      reportGame = game;
      let reported = false;
      try { reported = localStorage.getItem('playfeed:reported:' + game.id) === '1'; } catch {}
      openReport.textContent = reported ? '已檢舉' : '檢舉遊戲';
      openReport.disabled = reported;
      reportMenu.showModal();
    });
    card.querySelector('.comments-button').addEventListener('click', () => openComments(index));
    const byline = card.querySelector('.byline');
    byline.href = game.creator.hash;
    byline.textContent = '原作';
    byline.title = game.creator.name;
    for (const button of card.querySelectorAll('.reaction')) {
      renderSaved(card, false);
      button.addEventListener('click', () => PlayFeedAuth.requireLogin(async () => {
        const active = button.getAttribute('aria-pressed') !== 'true';
        button.disabled = true;
        invalidateEngagement(card);
        try {
          const state = await PlayFeedAuth.api('/api/account', { method: 'POST', body: JSON.stringify({ action: 'save', gameKey: new URL(game.url, location.origin + "/").href, active }) });
          renderSaved(card, state.saved);
          renderCounts(card, state);
        } catch (error) { notifyAction(error.message); }
        finally { button.disabled = false; }
      }));
    }
    const share = card.querySelector('.share');
    share.addEventListener('click', async () => {
      const link = new URL('/g/' + encodeURIComponent(game.id), location.origin);
      try {
        if (navigator.share) await navigator.share({ title: game.title, url: link.href });
        else {
          await navigator.clipboard.writeText(link.href);
          share.textContent = '已複製';
          setTimeout(() => { share.textContent = '分享'; }, 1800);
        }
      } catch (error) {
        if (error.name !== 'AbortError') window.prompt('複製遊戲連結', link.href);
      }
    });
    feed.append(card);
    return card;
  });

  const commentsSheet = document.querySelector('#comments-sheet');
  const commentsForm = document.querySelector('.comments-form');
  const commentsMessage = document.querySelector('.comments-message');
  const commentsList = document.querySelector('.comments-list');
  let commentsIndex = -1, commentsVersion = 0;
  function closeComments(restoreFocus = true) {
    const index = commentsIndex;
    commentsVersion++;
    commentsIndex = -1;
    commentsSheet.hidden = true;
    commentsSheet.style.removeProperty('--drag-y');
    document.body.classList.remove('comments-open');
    document.body.style.removeProperty('--comments-height');
    if (index >= 0) {
      cards[index].querySelector('.stage').removeAttribute('style');
      const button = cards[index].querySelector('.comments-button');
      button.setAttribute('aria-expanded','false');
      if (restoreFocus) button.focus({preventScroll:true});
    }
  }
  async function readComments(index) {
    const version = ++commentsVersion;
    commentsMessage.textContent = '載入留言中…';
    try {
      const key = new URL(games[index].url,location.origin + "/").href;
      const { comments: rows, ...counts } = await PlayFeedAuth.api('/api/account?action=comments&gameKey=' + encodeURIComponent(key));
      if (commentsIndex !== index || version !== commentsVersion) return;
      renderCounts(cards[index], counts);
      commentsList.replaceChildren();
      for (const row of rows.reverse()) {
        const li = document.createElement('li');
        const avatar = document.createElement('span'); avatar.className='comment-avatar'; avatar.textContent='P'; avatar.setAttribute('aria-hidden','true');
        const content = document.createElement('div');
        const name = document.createElement('span'); name.className='comment-name'; name.textContent=row.display_name;
        const time = document.createElement('time'); time.className='comment-time'; time.dateTime=row.created_at; time.textContent=new Date(row.created_at).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
        const body = document.createElement('p'); body.className='comment-body'; body.textContent=row.body;
        content.append(name,time,body); li.append(avatar,content); commentsList.append(li);
      }
      commentsMessage.textContent = rows.length ? '' : '還沒有留言，來聊聊這款遊戲吧。';
      const scroller = document.querySelector('.comments-content'); scroller.scrollTop=scroller.scrollHeight;
    } catch {
      if (version===commentsVersion) commentsMessage.textContent='留言暫時無法載入，請關閉後重試。';
    }
  }
  function openComments(index) {
    if (commentsIndex === index) { closeComments(); return; }
    closeComments(false);
    commentsIndex=index;
    commentsForm.reset(); commentsList.replaceChildren();
    const stage = cards[index].querySelector('.stage');
    const width=stage.offsetWidth, height=stage.offsetHeight;
    commentsSheet.hidden=false;
    document.body.style.setProperty('--comments-height',commentsSheet.offsetHeight+'px');
    document.body.classList.add('comments-open');
    const viewport=cards[index].querySelector('.game-viewport');
    const scale=Math.min(viewport.clientWidth/width,viewport.clientHeight/height,1);
    Object.assign(stage.style,{position:'absolute',width:width+'px',height:height+'px',left:'50%',top:'0',transformOrigin:'top center',transform:'translateX(-50%) scale('+scale+')'});
    cards[index].querySelector('.comments-button').setAttribute('aria-expanded','true');
    hideNavigation();
    readComments(index);
  }
  document.querySelector('.comments-close').addEventListener('click',()=>closeComments());
  window.addEventListener('resize',()=> { if(commentsIndex>=0) closeComments(false); });
  document.addEventListener('keydown',event=> { if(event.key==='Escape'&&commentsIndex>=0)closeComments(); });
  commentsForm.addEventListener('submit',async event=> {
    event.preventDefault();
    if (!PlayFeedAuth.user) { PlayFeedAuth.openLogin(() => commentsForm.requestSubmit()); return; }
    const index=commentsIndex, input=commentsForm.elements.comment, body=input.value.trim();
    const button=commentsForm.querySelector('button');
    if(index<0||!body||button.disabled)return;
    button.disabled=true; commentsMessage.textContent='送出中…';
    try {
      invalidateEngagement(cards[index]);
      const counts = await PlayFeedAuth.api('/api/account',{method:'POST',body:JSON.stringify({action:'comment',gameKey:new URL(games[index].url,location.origin + "/").href,body})});
      renderCounts(cards[index], counts);
      if(commentsIndex===index) { input.value=''; await readComments(index); }
    } catch { if(commentsIndex===index)commentsMessage.textContent='留言未送出，請再試一次。'; }
    finally {button.disabled=false;}
  });
  const grip=document.querySelector('.comments-grip');
  let dragStart=null, dragDistance=0;
  grip.addEventListener('pointerdown',event=> {
    if(event.target.closest('button')||!event.isPrimary||event.button!==0)return;
    dragStart=event.clientY; dragDistance=0; grip.setPointerCapture(event.pointerId);
  });
  grip.addEventListener('pointermove',event=> {
    if(dragStart===null)return;
    dragDistance=Math.max(0,event.clientY-dragStart);
    commentsSheet.style.setProperty('--drag-y',dragDistance+'px');
  });
  function finishDrag(event) {
    if(dragStart===null)return;
    const dismiss=event.type!=='pointercancel'&&dragDistance>60;
    dragStart=null; dragDistance=0;
    commentsSheet.style.removeProperty('--drag-y');
    if(dismiss)closeComments();
  }
  grip.addEventListener('pointerup',finishDrag);
  grip.addEventListener('pointercancel',finishDrag);

  let activeIndex = -1;
  let gameResizeObserver;
  let gameLoadFrame;
  let gameLoadTimer;
  let gameLoadVersion = 0;
  function unmountGame() {
    closeComments(false);
    gameLoadVersion++;
    cancelAnimationFrame(gameLoadFrame);
    clearTimeout(gameLoadTimer);
    gameResizeObserver?.disconnect();
    if (activeIndex >= 0) {
      const previous = cards[activeIndex].querySelector('.stage');
      cards[activeIndex].hidden = true;
      previous.classList.remove('native-viewport');
      const placeholder = document.createElement('div');
      placeholder.className = 'empty';
      placeholder.textContent = '準備遊戲中';
      previous.replaceChildren(placeholder);
    }
    activeIndex = -1;
  }

  function showGame(index) {
    if (activeIndex === index) return;
    unmountGame();
    activeIndex = index;
    hideNavigation();
    cards[index].hidden = false;
    previousButton.disabled = index === 0;
    nextButton.disabled = index === games.length - 1;
    notifyAction('');
    const game = games[index];
    loadEngagement(game, cards[index]);
    const frame = document.createElement('iframe');
    frame.title = game.title;
    frame.setAttribute('sandbox', game.external && (!game.recommended || game.allowStorage) ? 'allow-scripts allow-same-origin' : 'allow-scripts');
    frame.setAttribute('allow', 'fullscreen');
    const stage = cards[index].querySelector('.stage');
    if (game.viewport) {
      const { width, height, nativeSize } = game.viewport;
      if (nativeSize) {
        stage.classList.add('native-viewport');
      } else {
        frame.classList.add('fitted');
        frame.style.width = width + 'px';
        frame.style.height = height + 'px';
      }
      const fit = () => {
        const scale = Math.min(stage.clientWidth / width, stage.clientHeight / height, 1);
        if (nativeSize) {
          frame.style.width = Math.floor(width * scale) + 'px';
          frame.style.height = Math.floor(height * scale) + 'px';
        } else {
          frame.style.setProperty('--game-scale', scale);
        }
      };
      fit();
      gameResizeObserver = new ResizeObserver(fit);
      gameResizeObserver.observe(stage);
    }
    const version = gameLoadVersion;
    stage.querySelector('.empty').textContent = '載入遊戲中…';
    // Let the navigation paint first. A later choice cancels this pending load.
    gameLoadFrame = requestAnimationFrame(() => {
      gameLoadTimer = setTimeout(() => {
        if (version !== gameLoadVersion || activeIndex !== index) return;
        stage.replaceChildren(frame);
        frame.src = new URL(game.url, location.origin + "/").href;
      }, 0);
    });
    const url = new URL(location.href);
    url.pathname = "/g/" + encodeURIComponent(game.id);
    url.search = "";
    url.hash = "";
    if (location.href !== url.href) history.replaceState(null, '', url);
  }

  function gameFromLink() {
    const profile = profiles.get(location.hash);
    feed.hidden = Boolean(profile);
    creatorPage.hidden = !profile;
    switcher.hidden = Boolean(profile);
    if (profile) {
      backToFeed.href = '#' + (games[activeIndex]?.id ?? profile.games[0].id);
      renderProfile(profile);
      unmountGame();
      return;
    }
    const requestedId = location.hash.slice(1) || (location.pathname.startsWith('/g/') ? decodeURIComponent(location.pathname.slice(3)) : new URLSearchParams(location.search).get('id'));
    const index = games.findIndex(game => game.id === requestedId);
    const target = Math.max(index, 0);
    showGame(target);
  }

  gameFromLink();
  window.addEventListener('hashchange', gameFromLink);
  function switchGame(direction) {
    const target = activeIndex + direction;
    if (target < 0 || target >= games.length) return;
    showGame(target);
    revealNavigation(true);
  }
  for (const [button, direction] of [[previousButton, -1], [nextButton, 1]]) {
    button.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0) return;
      event.preventDefault();
      button.focus({ preventScroll: true });
      switchGame(direction);
    });
    button.addEventListener('click', event => {
      if (event.detail === 0) switchGame(direction);
    });
  }
  document.addEventListener('gesturestart', event => event.preventDefault(), { passive: false });
  document.addEventListener('wheel', event => { if (event.ctrlKey) event.preventDefault(); }, { passive: false });
  revealNavigation(true);
  PlayFeedAuth.onChange(() => {
    if (activeIndex >= 0) loadEngagement(games[activeIndex], cards[activeIndex]);
  });
</script>
</body>
</html>
