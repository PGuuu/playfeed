<title>PlayFeed — 滑一下，玩一個</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #101014; color: #faf8f2; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { touch-action: none; }
  [hidden] { display: none !important; }
  button, a { color: inherit; font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid #d6fb65; outline-offset: 4px; }
  #feed { position: fixed; inset: 0; height: 100dvh; overflow: hidden; }
  article { height: 100%; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; max-width: 900px; margin: auto; padding: max(8px, env(safe-area-inset-top)) clamp(8px, 2vw, 20px) max(8px, env(safe-area-inset-bottom)); }
  header, footer, .actions { display: flex; align-items: center; gap: 10px; }
  header, footer { justify-content: space-between; }
  .brand { font-size: 1.18rem; font-weight: 900; letter-spacing: -.06em; }
  .brand span { color: #d6fb65; }
  a.brand { color: inherit; text-decoration: none; }
  .nav-actions { display: flex; align-items: center; gap: 6px; }
  .search-button { background: transparent; border: 0; padding: 0; width: 38px; height: 38px; }
  .magnifier { width: 15px; height: 15px; border: 2px solid currentColor; border-radius: 50%; position: relative; }
  .magnifier::after { content: ''; position: absolute; width: 7px; height: 2px; background: currentColor; transform: rotate(45deg); right: -5px; bottom: -3px; }
  .search-dialog { width: min(580px, calc(100vw - 24px)); max-height: 85dvh; border: 1px solid #383841; border-radius: 18px; padding: 16px; background: #17171e; color: inherit; overscroll-behavior: contain; touch-action: pan-y; }
  .search-dialog::backdrop { background: #0009; }
  article { position: relative; }
  .game-more { position: absolute; z-index: 3; bottom: 12px; left: 12px; border: 0; padding: 0; width: 34px; height: 30px; border-radius: 10px; background: #19191e66; color: #ffffffa6; font-size: 23px; line-height: 1; touch-action: manipulation; }
  .report-dialog { width: min(380px,calc(100vw - 32px)); padding: 20px; border: 1px solid #383841; border-radius: 18px; background: #19191f; color: inherit; max-height: 85dvh; touch-action: pan-y; }
  .report-dialog::backdrop { background: #0009; }
  .report-dialog h2 { margin-bottom: 16px; }
  .report-dialog label { display: block; margin: 12px 0; font-size: 14px; }
  .report-dialog textarea { display: block; width: 100%; margin-top: 8px; background: #25252d; border: 1px solid #4c4b54; border-radius: 10px; color: inherit; padding: 10px; font: inherit; font-size: 16px; }
  .report-dialog .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .report-submit { background: #d6fb65; color: #161910; }
  #report-menu button { width: 100%; padding: 12px; border-radius: 10px; }
  .search-dialog form { display: flex; gap: 8px; }
  .search-dialog input { min-width: 0; flex: 1; background: #25252d; color: inherit; border: 1px solid #4c4b54; border-radius: 12px; padding: 12px; font: inherit; }
  .search-results { list-style: none; padding: 0; margin: 12px 0 0; }
  .search-results a { display: block; padding: 12px 4px; color: inherit; text-decoration: none; border-bottom: 1px solid #ffffff13; }
  .search-results small { display: block; margin-top: 5px; color: #aaa8b4; }
  .feed-brand { position: fixed; z-index: 5; top: 0; left: max(12px, calc((100% - 852px) / 2)); padding: 8px 12px; border-radius: 0 0 10px 10px; background: #101014; opacity: 0; transform: translateY(-100%); transition: transform .2s, opacity .2s; pointer-events: none; }
  .feed-brand.visible { opacity: 1; transform: translateY(0); }
  .feed-brand { right: max(12px, calc((100% - 852px) / 2)); display: flex; justify-content: space-between; align-items: center; }
  .feed-brand.visible { pointer-events: auto; }
  .account-link { pointer-events: auto; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: #25252d; text-decoration: none; }
  @media (prefers-reduced-motion: reduce) { .feed-brand { transition: none; } }
  .stage { min-height: 0; overflow: hidden; position: relative; border: 1px solid #383841; border-radius: 18px; background: #1b1b23; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  iframe.fitted { position: absolute; left: 50%; top: 50%; translate: -50% -50%; transform: scale(var(--game-scale, 0)); }
  .stage.native-viewport { display: grid; place-items: center; }
  .empty { height: 100%; display: grid; place-items: center; color: #bbb9c3; }
  h1, h2 { font-size: clamp(.98rem, 3.5vw, 1.25rem); margin: 0 0 3px; }
  footer { touch-action: manipulation; min-width: 0; }
  button, .source { display: inline-flex; align-items: center; justify-content: center; border: 1px solid #4c4b54; border-radius: 999px; background: #25252d; padding: .58rem .8rem; text-decoration: none; font-size: .8rem; white-space: nowrap; }
  .recommend { border-color: #d6fb65; background: #d6fb65; color: #161910; font-weight: 750; }
  .game-switcher { position: fixed; z-index: 4; right: max(12px, calc((100vw - 852px) / 2)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; width: 24px; border: 1px solid #ffffff30; border-radius: 10px; overflow: hidden; background: #19191e66; backdrop-filter: blur(8px); touch-action: none; }
  .game-switcher button { border: 0; border-radius: 0; background: transparent; width: 22px; height: 42px; padding: 0; color: #fff; }
  .game-switcher button + button { border-top: 1px solid #ffffff22; }
  .game-switcher button:active { background: #ffffff30; }
  .game-switcher button:disabled { opacity: .25; cursor: default; }
  .triangle { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; }
  .triangle.up { border-bottom: 6px solid currentColor; }
  .triangle.down { border-top: 6px solid currentColor; }
  .like { gap: 4px; font-variant-numeric: tabular-nums; }
  .like .heart { font-size: 23px; line-height: 1; }
  .like[aria-pressed="true"] { color: #ff4d6d; }
  .like-count { font-size: 12px; }
  .action-status { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #25252d; padding: 8px 14px; border-radius: 12px; z-index: 6; }
  .action-status:empty { display: none; }
  .actions { flex: 0 0 auto; gap: 6px; }
  .byline { min-width: 0; padding-block: 8px; color: #dedce4; font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-underline-offset: 3px; }
  .creator-page { max-width: 650px; height: 100dvh; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; margin: auto; padding: 24px 16px; }
  .creator-page header { margin-bottom: 40px; }
  .creator-page h1 { margin: 8px 0; font-size: clamp(1.8rem, 7vw, 2.8rem); }
  .creator-page .label { color: #d6fb65; font-size: .85rem; }
  .creator-page .note { color: #bbb9c3; line-height: 1.5; }
  .works { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; list-style: none; padding: 0; margin-top: 20px; }
  .works a { position: relative; display: block; aspect-ratio: 1; overflow: hidden; border: 1px solid #383841; border-radius: 8px; background: #1b1b23; text-decoration: none; }
  .works a:hover { border-color: #d6fb65; }
  .works img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .works .text-cover { display: grid; place-items: center; padding: 12px; background: radial-gradient(at 25% 15%, #35414b, #232330 72%); }
  .text-cover .work-title { position: static; padding: 0; background: none; text-align: center; }
  .work-title { position: absolute; inset: auto 0 0; padding: 28px 10px 10px; background: linear-gradient(transparent, #000e); font-size: clamp(.8rem, 3vw, 1.05rem); font-weight: 750; }
  @media (max-width: 420px) { .actions { gap: 4px; } .actions button, .actions .source { padding-inline: 8px; } .recommend { font-size: 12px; } }

  .game-viewport { min-height: 0; position: relative; overflow: hidden; }
  .game-viewport > .stage { width: 100%; height: 100%; }
  body.comments-open article { height: calc(100% - var(--comments-height)); }
  body.comments-open .game-switcher { top: calc((100dvh - var(--comments-height)) / 2); }
  .comments-sheet { position: fixed; z-index: 7; bottom: 0; left: 50%; width: min(900px,100%); height: min(48dvh,440px); background: #19191f; border: 1px solid #383841; border-bottom: 0; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; transform: translate(-50%,var(--drag-y,0px)); box-shadow: 0 -8px 30px #0004; animation: sheet-in .2s ease-out; padding-bottom: env(safe-area-inset-bottom); }
  @keyframes sheet-in { from { transform: translate(-50%,100%); } }
  .comments-grip { position: relative; flex-shrink: 0; text-align: center; padding: 20px 48px 12px; touch-action: none; cursor: grab; border-bottom: 1px solid #ffffff12; }
  .comments-grip::before { content: ''; position: absolute; width: 32px; height: 4px; border-radius: 3px; background: #777782; top: 8px; left: calc(50% - 16px); }
  .comments-grip h2 { margin: 0; font-size: 15px; }
  .comments-close { position: absolute; right: 10px; top: 14px; border: 0; background: transparent; padding: 4px 10px; font-size: 20px; }
  .comments-content { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 8px 18px; }
  .comments-list { list-style: none; margin: 0; padding: 0; }
  .comments-list li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 10px 0; }
  .comment-avatar { width: 30px; height: 30px; display: grid; place-items: center; background: #34343e; border-radius: 50%; font-size: 13px; }
  .comment-name { font-size: 13px; font-weight: 700; }
  .comment-time { color: #9997a3; font-size: 11px; margin-left: 8px; }
  .comment-body { margin: 5px 0 0; font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .comments-message { color: #bbb9c3; font-size: 13px; }
  .comments-form { display: flex; gap: 8px; flex-shrink: 0; padding: 12px; border-top: 1px solid #ffffff12; }
  .comments-form input { min-width: 0; flex: 1; border: 1px solid #42424d; border-radius: 22px; padding: 10px 14px; background: #25252d; color: inherit; font: inherit; font-size: 16px; touch-action: manipulation; }
  .comments-form button { border: 0; background: transparent; color: #d6fb65; }
  #login-dialog { width: min(360px,calc(100% - 32px)); border: 1px solid #3a3a43; border-radius: 20px; padding: 0; color: #faf8f2; background: #19191f; }
  #login-dialog::backdrop { background: #000a; backdrop-filter: blur(4px); }
  .login-box { padding: 24px; text-align: center; }
  .login-box h2 { margin: 0 0 8px; }
  .login-box p { color: #aaa8b3; font-size: 14px; line-height: 1.5; }
  #phuze-widget { min-height: 54px; text-align: left; margin-top: 18px; }
  .login-cancel { margin-top: 12px; border: 0; background: transparent; color: #aaa8b3; }
  @media(prefers-reduced-motion:reduce) { .comments-sheet { animation: none; } }
  article { grid-template-rows: minmax(0, 1fr); }
  article > footer { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); left: 16px; right: 16px; z-index: 4; padding: 10px; border-radius: 14px; background: #101014ed; visibility: hidden; pointer-events: none; }
  body.controls-visible article > footer { visibility: visible; pointer-events: auto; }
  .actions { flex-wrap: wrap; justify-content: flex-end; }
  .byline { flex-shrink: 0; }
  @media(max-width:420px) { article > footer { left: 10px; right: 10px; gap: 6px; padding: 8px; } .actions { gap: 4px; } .actions button,.actions a { padding: 8px 6px; font-size: 12px; } }
  .comments-button, .reaction { position: relative; overflow: visible; }
  .action-count { position: absolute; top: -7px; right: -5px; min-width: 17px; padding: 1px 4px; border: 1px solid #55545f; border-radius: 999px; background: #373640; color: #faf8f2; font-size: 10px; font-weight: 700; line-height: 14px; font-variant-numeric: tabular-nums; pointer-events: none; }
  .reaction[aria-pressed="true"] .action-count { background: #d6fb65; color: #101014; border-color: #d6fb65; }

  :root{--orange:#ff8b3d;--orange-light:#ffb46c;--cream:#fff3df;--ink:#482515}
  .feed-brand{padding:12px 16px;background:var(--orange);color:var(--ink);border-radius:0 0 22px 22px;box-shadow:0 8px 24px #0003}
  .feed-brand .brand{font-size:24px}.feed-brand .brand span{color:var(--cream)}
  .nav-actions{gap:10px}.search-button,.account-link{width:44px;height:44px}.account-link{background:var(--cream);color:var(--ink);font-weight:800}
  article>footer{padding:14px 12px;background:#ff8b3df5;color:var(--ink);border:1px solid #ffbd83;border-radius:22px;box-shadow:0 8px 28px #0004;gap:10px}
  .byline{color:var(--ink);font-size:14px;flex:0 0 auto}.actions{flex:1;flex-wrap:nowrap;gap:10px}
  .actions button{min-width:60px;min-height:48px;padding:12px 14px;border:0;background:var(--cream);color:var(--ink);font-size:16px;font-weight:700;flex:1}
  .actions .reaction[aria-pressed=true]{background:var(--ink);color:var(--cream)}
  .action-count{top:-8px;right:-4px;min-width:21px;font-size:11px;line-height:17px;background:var(--ink);color:var(--cream);border-color:var(--orange)}
  .game-switcher{width:24px;border-radius:11px;border:1px solid #ffbc8460;background:#ff8b3d7a;box-shadow:0 4px 18px #0002;backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%)}
  .game-switcher button{width:22px;height:52px;color:var(--ink)}.game-switcher button+button{border-color:#71350f30}.game-switcher button:active{background:#ffb46ca6}
  .triangle{border-left-width:4px;border-right-width:4px}.triangle.up{border-bottom-width:7px}.triangle.down{border-top-width:7px}#toggle-controls svg{width:14px;height:14px}
  .game-more{width:42px;height:38px;font-size:28px}body.controls-visible .game-more{bottom:100px}#delete-game{margin-top:8px;background:#4c2025;color:#ffd4c8;border-color:#8b4345}
  .save-hint{position:fixed;z-index:8;right:20px;top:80px;width:min(300px,calc(100vw - 32px));padding:20px;background:var(--cream);color:var(--ink);border:1px solid #ffbd83;border-radius:18px;box-shadow:0 12px 36px #0007;touch-action:manipulation}
  .save-hint::before{content:'';position:absolute;top:-8px;right:18px;width:14px;height:14px;transform:rotate(45deg);background:var(--cream);border-left:1px solid #ffbd83;border-top:1px solid #ffbd83}
  .save-hint h2{font-size:18px;margin-right:20px}.save-hint p{font-size:14px;line-height:1.6;margin:10px 0 16px}.save-hint button{border:0;background:var(--orange);color:var(--ink);font-weight:700;font-size:14px}
  .save-hint .hint-close{position:absolute;right:10px;top:8px;background:none;font-size:22px;padding:4px 8px}.save-highlight{outline:3px solid var(--cream);outline-offset:5px;box-shadow:0 0 0 10px #ff8b3d80}
  @media(max-width:420px){article>footer{left:10px;right:10px;padding:12px 10px;gap:8px}.actions{gap:8px}.actions button{padding:12px 8px;font-size:15px;min-width:58px}.feed-brand{left:10px;right:10px}.byline{font-size:13px}}

<body>
<dialog id="login-dialog" aria-labelledby="login-heading"><div class="login-box"><h2 id="login-heading">Email 認證</h2><p>輸入 Email，點信中的認證連結，就能跨瀏覽器同步收藏與評分。</p><div id="phuze-widget"></div><button class="login-cancel" type="button" data-close-login>先逛逛</button></div></dialog>
<dialog class="search-dialog" aria-label="搜尋遊戲">
  <form method="dialog"><input type="search" id="game-search" aria-label="遊戲關鍵字" placeholder="搜尋遊戲、作者" autocomplete="off"><button aria-label="關閉搜尋">關閉</button></form>
  <p id="search-status" role="status"></p>
  <ul class="search-results"></ul>
</dialog>
<dialog id="report-menu" class="report-dialog" aria-label="遊戲選項">
  <button type="button" id="delete-game" hidden>刪除遊戲</button>
  <button type="button" id="open-report">檢舉遊戲</button>
  <div class="dialog-actions"><button type="button" data-close>取消</button></div>
</dialog>
<dialog id="report-dialog" class="report-dialog" aria-labelledby="report-heading">
  <h2 id="report-heading">檢舉遊戲</h2>
  <form id="report-form">
    <label><input type="radio" name="reason" value="not_playable" required> 無法載入或操作</label>
    <label><input type="radio" name="reason" value="inappropriate"> 內容不適合</label>
    <label><input type="radio" name="reason" value="attribution"> 作者或版權問題</label>
    <label><input type="radio" name="reason" value="other"> 其他</label>
    <label>補充說明（選填）<textarea name="details" maxlength="1000" rows="3"></textarea></label>
    <p id="report-message" role="status"></p>
    <div class="dialog-actions"><button type="button" data-close>取消</button><button class="report-submit" type="submit">送出檢舉</button></div>
  </form>
</dialog>
<section id="comments-sheet" class="comments-sheet" role="region" aria-labelledby="comments-heading" hidden>
  <div class="comments-grip" aria-label="向下拖曳收起評分"><h2 id="comments-heading">遊戲評分</h2><button class="comments-close" type="button" aria-label="關閉評分">×</button></div>
  <div class="comments-content">
    <div class="rating-summary" aria-label="星等分布"><div class="rating-summary-header"><p id="rating-total">讀取評分中…</p><button type="button" id="rating-edit" hidden>修改我的評語</button></div><div class="rating-row" data-stars="3"><span class="rating-stars" aria-hidden="true">★★★</span><span class="rating-bar"><i></i></span><span class="rating-count">– 人</span></div><div class="rating-row" data-stars="2"><span class="rating-stars" aria-hidden="true">★★☆</span><span class="rating-bar"><i></i></span><span class="rating-count">– 人</span></div><div class="rating-row" data-stars="1"><span class="rating-stars" aria-hidden="true">★☆☆</span><span class="rating-bar"><i></i></span><span class="rating-count">– 人</span></div></div>
    <p class="comments-message" role="status"></p><button type="button" id="ratings-reload" hidden>重新載入</button><ul class="comments-list"></ul>
  </div>
  <form class="comments-form">
    <fieldset class="rating-choice"><legend>你的評分</legend><label><input type="radio" name="stars" value="none" aria-label="不評分" checked required><span class="no-rating">不評分</span></label><label><input type="radio" name="stars" value="1" aria-label="1 顆星" required><span>★</span></label><label><input type="radio" name="stars" value="2" aria-label="2 顆星" required><span>★★</span></label><label><input type="radio" name="stars" value="3" aria-label="3 顆星" required><span>★★★</span></label></fieldset>
    <label class="review-label" for="rating-review">評語</label><textarea id="rating-review" name="comment" aria-label="評語" placeholder="這款遊戲玩起來如何？" maxlength="1000" rows="2" required></textarea>
    <div class="rating-submit-row"><p class="rating-form-status" role="status"></p><button type="submit">送出評語</button></div>
  </form>
</section>
<div class="feed-shell"><main id="feed" aria-label="PlayFeed 遊戲牆"></main>
<aside class="feed-rail" aria-label="我的收藏、搜尋與遊戲切換">
 <nav class="rail-tools" aria-label="帳號與搜尋"><a class="account-link" href="/account.html" aria-label="我的頁面"></a><button class="search-button" aria-label="搜尋遊戲" type="button"><span class="magnifier" aria-hidden="true"></span></button></nav>
 <nav class="game-switcher" aria-label="切換遊戲">
  <button id="previous-game" type="button" aria-label="上一款"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg><span class="switch-label">上一款</span></button>
  <button id="next-game" type="button" aria-label="下一款"><span class="switch-label">下一款</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
 </nav>
 <a class="feed-logo" href="/" aria-label="PlayFeed，重新整理遊戲"><span>playfeed<span class="logo-dot">.</span></span></a>
 <span class="saved-list-label" aria-live="polite" hidden></span>
</aside></div>
<div class="action-status" role="status" aria-live="polite"></div>
<div id="save-feedback" class="save-feedback" role="status" aria-live="polite" hidden></div>
<main id="creator" class="creator-page" aria-labelledby="creator-name" hidden>
  <header><span class="brand">Play<span>Feed</span></span><a class="source" id="back-to-feed" href="#stay-on-track">← 回遊戲牆</a></header>
  <span class="label">作品收錄</span>
  <h1 id="creator-name"></h1>
  <p class="note">PlayFeed 整理的作品集。</p>
  <a class="source" id="creator-site" target="_blank" rel="noopener noreferrer">原站 ↗</a>
  <ul class="works"></ul>
</main>
<template id="card">
  <article>

    <div class="game-viewport">
      <div class="stage"><div class="empty">準備遊戲中</div></div>
      <button class="game-expand" type="button" aria-label="放大遊戲" aria-expanded="false" title="放大遊戲"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
      <div class="source-dock">
        <button class="source-toggle" type="button" aria-label="查看遊戲標題與創作者" aria-expanded="false">來源</button>
        <button class="game-more" type="button" aria-label="更多遊戲選項"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
        <div class="game-info" aria-hidden="true" inert><a class="creator-card"><span class="creator-card-details"><span class="game-title"></span><span class="byline"></span></span><span class="creator-card-action">作品收錄 <span aria-hidden="true">›</span></span></a><a class="game-source" target="_blank" rel="noopener noreferrer">遊戲原站 ↗</a></div>
      </div>
    </div>
    <nav class="expanded-controls" aria-label="放大模式遊戲切換"><button class="expanded-previous" type="button">上一個遊戲</button><button class="expanded-next" type="button">下一個遊戲</button></nav>
    <footer>
      <div class="actions">
        <button class="comments-button" type="button" aria-label="評分" aria-expanded="false" aria-controls="comments-sheet"><span class="action-label">評分</span></button>
        <button class="share" type="button" aria-label="分享"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/></svg><span class="action-label">分享</span><span class="action-count" data-count="shares" aria-hidden="true">–</span></button>
        <button class="reaction" type="button" data-kind="saved" aria-label="儲存" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span class="action-label">save</span><span class="action-count" data-count="saves" aria-hidden="true">–</span></button>
      </div>
    </footer>
  </article>
</template>

<script src="/game-frame.js"></script><script src="/auth.js?v=20261114-email"></script><script src="/saves.js"></script><script src="/analytics.js"></script><script src="/recommendations.js"></script><script src="/catalog.js"></script><script src="/feed-order.js"></script><script type="module">
  let catalogError=false;
  const savedMode=new URLSearchParams(location.search).get('list')==='saved';
  const popularIdsPromise=Promise.resolve([]);
  const catalog=await loadPlayfeedGames().catch(()=>{catalogError=true;return[]});
  const reload=performance.getEntriesByType('navigation')[0]?.type==='reload';
  let requestedGameId='';
  if(!reload)try{requestedGameId=location.hash.slice(1)||(location.pathname.startsWith('/g/')?decodeURIComponent(location.pathname.slice(3)):new URLSearchParams(location.search).get('id'))||''}catch{}
  const games=savedMode?catalog:orderPlayfeedGames(catalog,{popularIds:await popularIdsPromise,requestedId:requestedGameId});
  let memberSavedKeys=new Set(),savedListError=false,savedMembershipVersion=0;
  async function readMemberSavedKeys(){
    if(PlayFeedAuth.checking)await new Promise(resolve=>{let stop=()=>{};stop=PlayFeedAuth.onChange(()=>{if(!PlayFeedAuth.checking){resolve();queueMicrotask(stop)}})});
    if(!PlayFeedAuth.user)return new Set();
    await PlayFeedSaves.merge();
    const collection=PlayFeedAuth.takeCollection?.()||await PlayFeedAuth.api('/api/account?action=collection');
    return new Set(collection.actions.filter(row=>row.kind==='save').map(row=>row.game_key));
  }
  if(savedMode)try{memberSavedKeys=await readMemberSavedKeys()}catch{savedListError=true}
  let savedOrder=[];
  try{const order=JSON.parse(sessionStorage.getItem('playfeed:saved-order:v1')||'[]');if(Array.isArray(order))savedOrder=order.filter(key=>typeof key==='string').slice(0,500)}catch{}
  const savedRanks=new Map(savedOrder.map((key,index)=>[key,index]));
  function savedKeys(){return new Set([...memberSavedKeys,...PlayFeedSaves.list().map(game=>game.url)])}
  function navigationQueue(){
    const keys=savedMode?savedKeys():null;
    return games.map((game,index)=>({index,key:new URL(game.url,location.origin+'/').href})).filter(item=>!keys||keys.has(item.key)).sort((a,b)=>savedMode?(savedRanks.get(a.key)??savedRanks.size+a.index)-(savedRanks.get(b.key)??savedRanks.size+b.index):a.index-b.index).map(item=>item.index);
  }
  async function refreshSavedMembership(){
    if(!savedMode)return;
    const version=++savedMembershipVersion;
    try{const keys=await readMemberSavedKeys();if(version!==savedMembershipVersion)return;memberSavedKeys=keys;savedListError=false;for(const card of cards)renderSaved(card,keys.has(card.dataset.gameKey));refreshSavedMode()}
    catch{if(version===savedMembershipVersion)savedListError=true}
  }
  let ignoreGameLinkOnReload=!savedMode&&performance.getEntriesByType('navigation')[0]?.type==='reload';
  try { sessionStorage.setItem('playfeed:catalog:v1', JSON.stringify({ time: Date.now(), games })); } catch {}
  const playfeed = { name: 'PlayFeed', url: 'https://playfeed-gilt.vercel.app/', hash: '#creator-playfeed' };
  const profiles = new Map();
  const creatorHashes = new Map();
  for (const game of games) {
    if (!game.creator) {
      const name = game.external ? game.author : playfeed.name;
      const identity = name.trim().toLocaleLowerCase();
      const hash = creatorHashes.get(identity) || '#creator-' + game.id;
      creatorHashes.set(identity, hash);
      game.creator = game.external
        ? { name, url: game.creator_url || game.url, hash }
        : playfeed;
    }
    const { hash } = game.creator;
    if (!profiles.has(hash)) profiles.set(hash, { ...game.creator, games: [] });
    profiles.get(hash).games.push(game);
    profiles.set('#creator-' + game.id, profiles.get(hash));
  }
  const feed = document.querySelector('#feed');
  const creatorPage = document.querySelector('#creator');
  const backToFeed = document.querySelector('#back-to-feed');
  const switcher = document.querySelector('.game-switcher');
  const previousButton = document.querySelector('#previous-game');
  const nextButton = document.querySelector('#next-game');
  const shell = document.querySelector('.feed-shell');
  const rail = document.querySelector('.feed-rail');
  let canDeleteGame=false, ownerCheckVersion=0;
  PlayFeedAuth.onChange(user => {
    const account = document.querySelector('.account-link');
    account.textContent = user?.email ? user.email[0].toUpperCase() : '';
    account.classList.toggle('signed-in',Boolean(user));
    account.title = user?.email || '我的收藏（此瀏覽器）';
    const version=++ownerCheckVersion;canDeleteGame=false;document.querySelector('#delete-game').hidden=true;
    if(user?.email?.toLowerCase()==='paulvongulla@gmail.com')PlayFeedAuth.api('/api/account?action=me').then(me=>{if(version!==ownerCheckVersion)return;canDeleteGame=me.isAdmin===true;document.querySelector('#delete-game').hidden=!canDeleteGame}).catch(()=>{});
  });
  let visitorToken;
  try {
    visitorToken = localStorage.getItem('playfeed:visitor-token');
    if (!/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(visitorToken || '')) {
      visitorToken = crypto.randomUUID();
      localStorage.setItem('playfeed:visitor-token', visitorToken);
    }
  } catch { visitorToken = crypto.randomUUID(); }
  const searchDialog = document.querySelector('.search-dialog');
  const searchInput = document.querySelector('#game-search');
  const reportMenu = document.querySelector('#report-menu');
  const reportDialog = document.querySelector('#report-dialog');
  const reportForm = document.querySelector('#report-form');
  const openReport = document.querySelector('#open-report');
  let reportGame;
  document.querySelector('#delete-game').addEventListener('click',async()=>{
    const game=reportGame;if(!game||!canDeleteGame)return;
    if(!window.confirm('確定刪除「'+game.title+'」？'))return;
    const button=document.querySelector('#delete-game');button.disabled=true;
    try{await PlayFeedAuth.api('/api/account',{method:'POST',body:JSON.stringify({action:'delete-game',gameId:game.id})});try{sessionStorage.removeItem('playfeed:catalog:v1')}catch{}location.assign('/')}
    catch(error){notifyAction(error.message)}finally{button.disabled=false}
  });
  for (const dialog of [reportMenu, reportDialog]) {
    dialog.querySelector('[data-close]').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => {
      if (event.target !== dialog) return;
      const rect = dialog.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
    });
  }
  openReport.addEventListener('click', () => {
    reportMenu.close();
    reportForm.reset();
    document.querySelector('#report-message').textContent = '';
    reportDialog.showModal();
  });
  reportForm.addEventListener('submit', async event => {
    event.preventDefault();
    const game = reportGame;
    if (!game) return;
    const button = reportForm.querySelector('[type=submit]');
    if (button.disabled) return;
    button.disabled = true;
    document.querySelector('#report-message').textContent = '正在送出…';
    try {
      await recommendationRequest('/playfeed_game_reports', {
        method: 'POST',
        headers: { Prefer: 'return=minimal' },
        body: JSON.stringify({
          game_id: game.id,
          game_url: new URL(game.url, location.origin + "/").href,
          game_title: game.title.slice(0,300),
          visitor_token: visitorToken,
          reason: reportForm.elements.reason.value,
          details: reportForm.elements.details.value.trim(),
        }),
      }).catch(error => {
        if (error.message !== '409') throw error;
      });
      try { localStorage.setItem('playfeed:reported:' + game.id,'1'); } catch {}
      window.PlayFeedAnalytics?.event('report_success',{game:game.id,title:game.title});
      reportDialog.close();
      notifyAction('已收到檢舉，會一併處理。');
    } catch {
      document.querySelector('#report-message').textContent = '檢舉未送出，請稍後再試。';
    } finally { button.disabled = false; }
  });
  function renderSearch() {
    const query = searchInput.value.trim().normalize('NFKC').toLocaleLowerCase();
    const matches = query ? games.filter(game => {
      if(savedMode&&!savedKeys().has(new URL(game.url,location.origin+'/').href))return false;
      const text = [game.title, game.author, game.creator?.name, game.url].join(' ').normalize('NFKC').toLocaleLowerCase();
      return query.split(/\s+/).every(word => text.includes(word));
    }) : [];
    const list = document.querySelector('.search-results');
    list.replaceChildren();
    document.querySelector('#search-status').textContent = query ? (matches.length ? `${matches.length} 款遊戲` : '找不到符合的遊戲') : '';
    for (const game of matches) {
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = '#' + game.id;
      const title = document.createElement('span');
      title.textContent = game.title;
      const author = document.createElement('small');
      author.textContent = game.creator?.name || game.author;
      link.append(title, author);
      link.addEventListener('click', () => {
        pendingEntrySource='search_selection';
        searchDialog.close();
        if (location.hash === link.hash) gameFromLink();
      });
      item.append(link);
      list.append(item);
    }
  }
  document.querySelector('.search-button').addEventListener('click', () => {
    searchDialog.showModal();
    searchInput.focus();
    renderSearch();
  });
  searchInput.addEventListener('input', renderSearch);
  searchDialog.querySelector('form').addEventListener('submit', event => {
    if (event.submitter) return;
    event.preventDefault();
    document.querySelector('.search-results a')?.click();
  });
  let actionStatusTimer;
  function notifyAction(message) {
    const status=document.querySelector('.action-status');
    clearTimeout(actionStatusTimer);status.textContent=message;
    actionStatusTimer=setTimeout(()=>{status.textContent=''},message==='已取消儲存'?500:2400);
    if(message==='已取消儲存'){clearTimeout(saveFeedbackTimer);document.querySelector('#save-feedback').hidden=true;document.querySelector('.account-link').classList.remove('saved-feedback')}
  }
  let saveFeedbackTimer;
  function showShareFlight(source){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    document.querySelectorAll('.share-plane').forEach(plane=>plane.remove());
    const rect=source.getBoundingClientRect(),plane=document.createElement('span');
    plane.className='share-plane';plane.setAttribute('aria-hidden','true');
    plane.style.cssText='position:fixed;left:0;top:0;width:32px;height:32px;z-index:10001;pointer-events:none;color:#fff;filter:drop-shadow(0 2px 4px #5b403b88)';
    plane.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" stroke="#fff3e4" stroke-width="1"><path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/></svg>';
    document.body.append(plane);
    let x=Math.min(innerWidth-36,Math.max(4,rect.left)),y=Math.min(innerHeight-36,Math.max(4,rect.top));
    const frames=[{transform:`translate(${x}px,${y}px) rotate(0deg)`,opacity:1}];
    const startX=x,startY=y,bend=(Math.random()-.5)*90;
    for(let i=1;i<=12;i++){
      const progress=i/12;
      const nx=Math.min(innerWidth-36,Math.max(4,startX+Math.sin(progress*Math.PI*2)*bend)),ny=startY-(startY+64)*progress;
      const angle=Math.atan2(ny-y,nx-x)*180/Math.PI+45;
      frames.push({transform:`translate(${nx}px,${ny}px) rotate(${angle}deg)`,opacity:1});x=nx;y=ny;
    }
    plane.animate(frames,{duration:1100,easing:'linear'}).finished.catch(()=>{}).finally(()=>plane.remove());
  }
  function showSwitchBomb(source, stage) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('.nav-effect').forEach(node => {
      node.getAnimations().forEach(animation => animation.cancel());
      node.remove();
    });
    const start = source.getBoundingClientRect(), end = stage.getBoundingClientRect();
    const x = start.left + start.width / 2, y = start.top + start.height / 2;
    const targetX = end.left + 28, targetY = end.bottom - 28;
    const bomb = document.createElement('span');
    bomb.className = 'nav-effect';
    bomb.setAttribute('aria-hidden', 'true');
    bomb.style.cssText = 'position:fixed;left:0;top:0;width:26px;height:26px;z-index:10000;pointer-events:none;filter:drop-shadow(0 2px 2px #44332340)';
    bomb.innerHTML = '<svg viewBox="0 0 28 28" aria-hidden="true"><path d="M18 9q-1-6 4-5" fill="none" stroke="#79502f" stroke-width="2"/><path d="m23 1 1 3 3 1-3 1-1 3-1-3-3-1 3-1Z" fill="#ffb42c"/><circle cx="13" cy="17" r="9" fill="#443323"/><path d="M7 16q0-4 4-4" fill="none" stroke="#fff7eb" stroke-width="2" stroke-linecap="round"/></svg>';
    document.body.append(bomb);
    const frames = [];
    const arc = Math.min(130, Math.max(50, end.height * .18));
    for (let i = 0; i <= 16; i++) {
      const t = i / 16;
      frames.push({transform:`translate(${x+(targetX-x)*t-13}px,${y+(targetY-y)*t-4*arc*t*(1-t)-13}px) rotate(${t*480}deg)`,opacity:1});
    }
    bomb.animate(frames, {duration:440,easing:'linear'}).finished.then(() => {
      for (let i = 0; i < 7; i++) {
        const spark = document.createElement('span'), ring = i === 0;
        spark.className = 'nav-effect';
        spark.setAttribute('aria-hidden', 'true');
        spark.style.cssText = `position:fixed;left:${targetX}px;top:${targetY}px;width:${ring?24:6}px;height:${ring?24:6}px;border-radius:50%;background:${ring?'transparent':i%2?'#ffb42c':'#ee8150'};${ring?'border:3px solid #ee9850;':''}z-index:10000;pointer-events:none`;
        document.body.append(spark);
        const angle = (i-1) * Math.PI / 3;
        spark.animate([
          {transform:'translate(-50%,-50%) scale(.4)',opacity:1},
          {transform:ring?'translate(-50%,-50%) scale(2.5)':`translate(-50%,-50%) translate(${Math.cos(angle)*32}px,${Math.sin(angle)*32}px) scale(.2)`,opacity:0}
        ], {duration:320,easing:'ease-out'}).finished.catch(() => {}).finally(() => spark.remove());
      }
    }).catch(() => {}).finally(() => bomb.remove());
  }
  function showSavedFeedback(source,pending=false){
    clearTimeout(actionStatusTimer);document.querySelector('.action-status').textContent='';
    const hint=document.querySelector('#save-feedback'),account=document.querySelector('.account-link'),rect=account.getBoundingClientRect();
    clearTimeout(saveFeedbackTimer);hint.textContent=pending?'正在儲存至我的收藏…':'已儲存至我的收藏';hint.hidden=false;
    hint.style.top=Math.max(8,rect.bottom+9)+'px';
    const right=Math.min(Math.max(8,innerWidth-rect.right),Math.max(8,innerWidth-hint.offsetWidth-8));
    hint.style.right=right+'px';
    hint.style.setProperty('--save-arrow-right',Math.max(8,Math.min(hint.offsetWidth-16,innerWidth-right-rect.left-rect.width/2-4))+'px');
    account.classList.add('saved-feedback');
    if(source&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
      const start=source.getBoundingClientRect(),x=start.left+start.width/2,y=start.top+start.height/2;
      const dx=rect.left+rect.width/2-x,dy=rect.top+rect.height/2-y;
      for(let shot=0;shot<3;shot++){
      const beam=document.createElement('span');beam.className='save-laser';beam.setAttribute('aria-hidden','true');
      beam.style.cssText=`position:fixed;pointer-events:none;z-index:10000;left:${x}px;top:${y}px;width:64px;height:9px;border-radius:99px;background:#ff174f;border:2px solid #ffb3ca;box-shadow:0 0 10px 3px #ff174f,0 0 26px 7px #ff005c;transform-origin:center`;
      document.body.append(beam);
      const angle=Math.atan2(dy,dx)*180/Math.PI;
      const animation=beam.animate([{transform:`translate(-50%,-50%) rotate(${angle}deg) scaleX(.3)`,opacity:0},{offset:.15,transform:`translate(${dx*.15}px,${dy*.15}px) rotate(${angle}deg)`,opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${angle}deg) scaleX(.3)`,opacity:0}],{duration:420,delay:shot*140,fill:'backwards',easing:'ease-in-out'});
      animation.finished.then(()=>{
        if(hint.hidden)return;
        account.animate([{filter:'brightness(1)',boxShadow:'0 0 0 0 #ff005c'},{offset:.25,filter:'brightness(2.2)',boxShadow:'0 0 16px 10px #ff2b68,0 0 40px 20px #ff005cbb',transform:'scale(1.16)'},{filter:'brightness(1)',boxShadow:'0 0 0 3px #d9874470',transform:'scale(1)'}],{duration:450});
      }).catch(()=>{}).finally(()=>beam.remove());
      }
    }
    saveFeedbackTimer=setTimeout(()=>{hint.hidden=true;account.classList.remove('saved-feedback')},2200);
  }
  window.addEventListener('resize',()=>{document.querySelector('#save-feedback').hidden=true;document.querySelector('.account-link').classList.remove('saved-feedback')});
  const engagementVersions = new WeakMap();
  function invalidateEngagement(card) {
    const version = (engagementVersions.get(card) || 0) + 1;
    engagementVersions.set(card, version);
    return version;
  }
  function renderSaved(card, active) {
    if(card.dataset.savePending==='true')return;
    const button = card.querySelector('[data-kind="saved"]');
    const memberSaved=Boolean(PlayFeedAuth.user)&&active===true;
    card.dataset.memberSaved=String(memberSaved);
    button.setAttribute('aria-pressed', String(memberSaved || PlayFeedSaves.has(card.dataset.gameKey)));
    button.querySelector('.action-label').textContent = 'save';
  }
  function renderCounts(card, counts) {
    for (const [field, selector, label] of [
      ['saveCount', '[data-kind="saved"]', '儲存'],
      ['shareCount', '.share', '分享']
    ]) {
      if(field==='saveCount'&&card.dataset.savePending==='true')continue;
      const count = field === 'saveCount' ? (counts.displaySaveCount ?? counts.saveCount) : counts[field];
      if (!Number.isSafeInteger(count) || count < 0) continue;
      const button = card.querySelector(selector);
      const countElement=button.querySelector('.action-count');
      const previous=Number(countElement.dataset.value);
      countElement.dataset.value=String(count);
      countElement.textContent=count>=10000?(count/10000).toFixed(count>=100000?0:1)+'萬':count.toLocaleString('zh-TW');
      button.dataset.hasCount=String(count>0);
      if(previous<count&&!matchMedia('(prefers-reduced-motion: reduce)').matches)countElement.animate([{transform:'scale(1)'},{transform:'scale(1.2)'},{transform:'scale(1)'}],{duration:240});
      button.setAttribute('aria-label', label + '，共 ' + count + (field === 'commentCount' ? ' 則留言' : ' 次'+label));
    }
  }
  async function loadEngagement(game, card) {
    const version = invalidateEngagement(card);
    const key = encodeURIComponent(new URL(game.url, location.origin + '/').href)+'&gameId='+encodeURIComponent(game.id);
    try {
      // Totals are public; checking login is unnecessary to read them.
      const counts = await PlayFeedAuth.api('/api/account?action=counts&gameKey=' + key);
      if (engagementVersions.get(card) !== version) return;
      renderCounts(card, counts);
      if (!PlayFeedAuth.user) { renderSaved(card, false); return; }
      const state = await PlayFeedAuth.api('/api/account?action=state&gameKey=' + key);
      if (engagementVersions.get(card) !== version) return;
      renderSaved(card, state.saved);
      renderCounts(card, state);
    } catch {
      // Keep unavailable counts as a dash, rather than reporting a false zero.
    }
  }
  function renderProfile(profile) {
    document.querySelector('#creator-name').textContent = profile.name;
    document.querySelector('#creator-site').href = profile.url;
    const works = document.querySelector('.works');
    works.replaceChildren();
    for (const game of profile.games) {
      if(savedMode&&!savedKeys().has(new URL(game.url,location.origin+'/').href))continue;
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = '#' + game.id;
      const cover = document.createElement('img');
      cover.alt = '';
      cover.loading = 'lazy';
      cover.decoding = 'async';
      cover.width = 390; cover.height = 700;
      cover.referrerPolicy = 'no-referrer';
      const screenshot = 'https://image.thum.io/get/noanimate/width/390/maxAge/168/?url=' + encodeURIComponent(new URL(game.url, location.origin).href);
      const sources = [...new Set([game.cover, game.screenshot, '/api/og?id='+encodeURIComponent(game.id)+'&v=4', screenshot, '/share-cards/'+encodeURIComponent(game.id)+'.png', '/share-cards/default.png'].filter(Boolean))];

      const dx = end.left + end.width / 2 - x, dy = end.top + end.height / 2 - y;
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;

        document.body.append(beam);
        const transform = (progress, scale = 1) => `translate(-50%,-50%) translate(${dx * progress}px,${dy * progress}px) rotate(${angle}deg) scaleX(${scale})`;
        const animation = beam.animate([
          {transform:transform(0,.3),opacity:0},
          {offset:.15,transform:transform(.15),opacity:1},
          {transform:transform(1,.3),opacity:0}
        ], {duration:520,delay:shot*140,fill:'backwards',easing:'ease-in-out'});
        expandHintAnimations.push(animation);
        animation.finished.then(() => {
          if (!gameExpanded || !target.isConnected) return;

        }).catch(() => {}).finally(() => beam.remove());
      }
    });

        const dock = cards[index].querySelector('.source-dock');
        dock.style.setProperty('--source-left', (gutter >= 34 ? (gutter - 28) / 2 : 6) + 'px');
        dock.style.bottom = (Math.max(0, (stage.clientHeight - frameHeight * scale) / 2) + 16) + 'px';
        const expand = cards[index].querySelector('.game-expand');
        expand.style.right = (gutter + 8) + 'px';
        expand.style.bottom = (Math.max(0, (stage.clientHeight - frameHeight * scale) / 2) + 8) + 'px';
        dock.classList.toggle('over-game', gutter < 34);
        if (nativeSize) {
          frame.style.width = Math.floor(frameWidth * scale) + 'px';
          frame.style.height = Math.floor(frameHeight * scale) + 'px';
        } else {
          frame.style.width = frameWidth + 'px';
          frame.style.height = frameHeight + 'px';
          frame.style.setProperty('--game-scale', scale);
        }
      };
      fit();
      gameResizeObserver = new ResizeObserver(fit);
      gameResizeObserver.observe(stage);
    }
    const version = gameLoadVersion;
    frame.addEventListener('load', () => {
      if (version !== gameLoadVersion || activeIndex !== index || !frame.getAttribute('src')) return;
      clearTimeout(gameSlowTimer);
      delete stage.dataset.loading;
      stage.querySelector('.game-loading')?.remove();
      setSourceOpen(cards[index], true);
      const enterDuration = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 220;
      sourceHintTimer = setTimeout(() => {
        // Keep an intro open if the user is already inspecting its links.
        if (!cards[index].querySelector('.game-info').contains(document.activeElement)) setSourceOpen(cards[index], false);
      }, 1000 + enterDuration);
    }, { once: true });
    const loading = document.createElement('div');
    loading.className = 'game-loading';
    loading.setAttribute('role', 'status');
    loading.setAttribute('aria-live', 'polite');
    const loadingTitle = document.createElement('strong');
    loadingTitle.textContent = '遊戲匯入中';
    const loadingHint = document.createElement('span');
    loadingHint.textContent = '可以隨時切換遊戲或使用其他按鈕';
    loading.append(loadingTitle, loadingHint);
    stage.dataset.loading = 'true';
    stage.replaceChildren(loading);
    gameSlowTimer = setTimeout(() => {
      if (version !== gameLoadVersion || activeIndex !== index) return;
      loadingHint.textContent = '這款遊戲匯入較慢，可以先切換其他遊戲';
    }, 12000);
    // Let the navigation paint first. A later choice cancels this pending load.
    gameLoadFrame = requestAnimationFrame(() => {
      gameLoadTimer = setTimeout(() => {
        if (version !== gameLoadVersion || activeIndex !== index) return;
        frame.src = gameUrl;
        stage.prepend(frame);
      }, 0);
    });
    const url = new URL(location.href);
    url.pathname = "/g/" + encodeURIComponent(game.id);
    url.search = savedMode?'?list=saved':'';
    url.hash = "";
    if (location.href !== url.href) history.replaceState(null, '', url);
  }

  function gameFromLink(entrySource) {
    const profile = profiles.get(location.hash);
    feed.hidden = Boolean(profile);
    creatorPage.hidden = !profile;
    shell.hidden = Boolean(profile);
    if (profile) {
      backToFeed.href = '#' + (games[activeIndex]?.id ?? profile.games[0].id);
      renderProfile(profile);
      unmountGame();
      return;
    }
    if(!games.length){feed.replaceChildren();const empty=document.createElement('p');empty.className='empty';empty.textContent=catalogError?'遊戲清單暫時無法載入，請重新整理。':'目前沒有可遊玩的遊戲';feed.append(empty);return;}
    const queue=navigationQueue();
    if(savedMode&&!queue.length){refreshSavedMode();return;}
    const requestedId = ignoreGameLinkOnReload ? '' : (location.hash.slice(1) || (location.pathname.startsWith('/g/') ? decodeURIComponent(location.pathname.slice(3)) : new URLSearchParams(location.search).get('id')));
    ignoreGameLinkOnReload=false;
    const index = games.findIndex(game => game.id === requestedId);
    const target = savedMode?(queue.includes(index)?index:queue[0]):Math.max(index, 0);
    const source=typeof entrySource==='string'?entrySource:pendingEntrySource||(firstGameEntry?(savedMode?'saved_selection':undefined):'internal_selection');
    pendingEntrySource=null;firstGameEntry=false;
    showGame(target,source);
  }

  gameFromLink();
  window.addEventListener('hashchange', gameFromLink);
  document.addEventListener('click',event=>{if(event.target.closest('.works a,#back-to-feed'))pendingEntrySource='creator_selection';},true);
  function switchGame(direction) {
    const queue=navigationQueue(),position=queue.indexOf(activeIndex);
    if(position<0||!queue.length)return;
    const target=queue[(position+direction+queue.length)%queue.length];
    const source=gameExpanded?cards[activeIndex].querySelector(direction<0?'.expanded-previous':'.expanded-next'):(direction<0?previousButton:nextButton);
    showSwitchBomb(source,cards[activeIndex].querySelector('.stage'));
    const wasExpanded = gameExpanded;
    if (wasExpanded) setGameExpanded(false, false);
    window.PlayFeedAnalytics?.event(direction<0?'previous_game':'next_game');
    showGame(target,direction<0?'previous':'next');
    if(wasExpanded)(direction<0?previousButton:nextButton).focus({preventScroll:true});

  }
  let gesture=null,suppressClickUntil=0;
  switcher.addEventListener('pointerdown',event=>{
    if(!event.isPrimary||event.button!==0)return;
    const vertical=landscapeFeed.matches;
    const position=vertical?event.clientY:event.clientX;
    gesture={id:event.pointerId,position,vertical,moved:false};
  });
  switcher.addEventListener('pointermove',event=>{
    if(!gesture||gesture.id!==event.pointerId)return;
    if(Math.abs((gesture.vertical?event.clientY:event.clientX)-gesture.position)>10){
      gesture.moved=true;
      if(!switcher.hasPointerCapture(event.pointerId))switcher.setPointerCapture(event.pointerId);
    }
  });
  switcher.addEventListener('pointerup',event=>{
    if(!gesture||gesture.id!==event.pointerId)return;
    const {position,vertical,moved}=gesture;gesture=null;
    const distance=(vertical?event.clientY:event.clientX)-position;
    if(moved||Math.abs(distance)>=32)suppressClickUntil=performance.now()+500;
    if(switcher.hasPointerCapture(event.pointerId))switcher.releasePointerCapture(event.pointerId);
    if(Math.abs(distance)>=32)switchGame(distance<0?1:-1);
  });
  switcher.addEventListener('pointercancel',()=>gesture=null);
  switcher.addEventListener('lostpointercapture',()=>gesture=null);
  for(const [button,direction]of [[previousButton,-1],[nextButton,1]])button.addEventListener('click',event=>{
    if(performance.now()<suppressClickUntil)return;
    switchGame(direction);
  });
  let lastWheel=0;
  switcher.addEventListener('wheel',event=>{
    if(event.ctrlKey)return;event.preventDefault();
    if(Math.abs(event.deltaY)<8||performance.now()-lastWheel<400)return;
    lastWheel=performance.now();switchGame(event.deltaY>0?1:-1);
  },{passive:false});
  document.addEventListener('gesturestart', event => event.preventDefault(), { passive: false });
  document.addEventListener('wheel', event => { if (event.ctrlKey) event.preventDefault(); }, { passive: false });

  PlayFeedAuth.onChange(() => {
    if (activeIndex >= 0) loadEngagement(games[activeIndex], cards[activeIndex]);
  });
</script>
</body>
</html>
