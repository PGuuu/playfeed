<style>
  * { box-sizing: border-box; }
  :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #101014; color: #faf8f2; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { touch-action: none; }
  [hidden] { display: none !important; }
  button, a { color: inherit; font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid #d6fb65; outline-offset: 4px; }
  #feed { position: fixed; inset: 0; height: 100dvh; overflow: hidden; }
  article { height: 100%; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; max-width: 900px; margin: auto; padding: max(8px, env(safe-area-inset-top)) clamp(8px, 2vw, 20px) max(8px, env(safe-area-inset-bottom)); }
  header, footer, .actions { display: flex; align-items: center; gap: 10px; }

  .brand { font-size: 1.18rem; font-weight: 900; letter-spacing: -.06em; }

  a.brand { color: inherit; text-decoration: none; }
  .nav-actions { display: flex; align-items: center; gap: 6px; }
  .search-button { background: transparent; border: 0; padding: 0; width: 38px; height: 38px; }
  .magnifier { width: 15px; height: 15px; border: 2px solid currentColor; border-radius: 50%; position: relative; }
  .magnifier::after { content: ''; position: absolute; width: 7px; height: 2px; background: currentColor; transform: rotate(45deg); right: -5px; bottom: -3px; }
  .search-dialog { width: min(580px, calc(100vw - 24px)); max-height: 85dvh; border: 1px solid #383841; border-radius: 18px; padding: 16px; background: #17171e; color: inherit; overscroll-behavior: contain; touch-action: pan-y; }
  .search-dialog::backdrop { background: #0009; }
  article { position: relative; }
  .game-more { position: absolute; z-index: 3; bottom: 12px; left: 12px; border: 0; padding: 0; width: 34px; height: 30px; border-radius: 10px; background: #19191e66; color: #ffffffa6; font-size: 23px; line-height: 1; touch-action: manipulation; }
  .report-dialog { width: min(380px,calc(100vw - 32px)); padding: 20px; border: 1px solid #383841; border-radius: 18px; background: #19191f; color: inherit; max-height: 85dvh; touch-action: pan-y; }
  .report-dialog::backdrop { background: #0009; }
  .report-dialog h2 { margin-bottom: 16px; }
  .report-dialog label { display: block; margin: 12px 0; font-size: 14px; }
  .report-dialog textarea { display: block; width: 100%; margin-top: 8px; background: #25252d; border: 1px solid #4c4b54; border-radius: 10px; color: inherit; padding: 10px; font: inherit; font-size: 16px; }
  .report-dialog .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .report-submit { background: #d6fb65; color: #161910; }
  #report-menu button { width: 100%; padding: 12px; border-radius: 10px; }
  .search-dialog form { display: flex; gap: 8px; }
  .search-dialog input { min-width: 0; flex: 1; background: #25252d; color: inherit; border: 1px solid #4c4b54; border-radius: 12px; padding: 12px; font: inherit; }
  .search-results { list-style: none; padding: 0; margin: 12px 0 0; }
  .search-results a { display: block; padding: 12px 4px; color: inherit; text-decoration: none; border-bottom: 1px solid #ffffff13; }
  .search-results small { display: block; margin-top: 5px; color: #aaa8b4; }
  .feed-brand { position: fixed; z-index: 5; top: 0; left: max(12px, calc((100% - 852px) / 2)); padding: 8px 12px; border-radius: 0 0 10px 10px; background: #101014; opacity: 0; transform: translateY(-100%); transition: transform .2s, opacity .2s; pointer-events: none; }
  .feed-brand.visible { opacity: 1; transform: translateY(0); }
  .feed-brand { right: max(12px, calc((100% - 852px) / 2)); display: flex; justify-content: space-between; align-items: center; }
  .feed-brand.visible { pointer-events: auto; }
  .account-link { pointer-events: auto; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: #25252d; text-decoration: none; }
  @media (prefers-reduced-motion: reduce) { .feed-brand { transition: none; } }
  .stage { min-height: 0; overflow: hidden; position: relative; border: 1px solid #383841; border-radius: 18px; background: #1b1b23; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  iframe.fitted { position: absolute; left: 50%; top: 50%; translate: -50% -50%; transform: scale(var(--game-scale, 0)); }
  .stage.native-viewport { display: grid; place-items: center; }
  .empty { height: 100%; display: grid; place-items: center; color: #bbb9c3; }
  h1, h2 { font-size: clamp(.98rem, 3.5vw, 1.25rem); margin: 0 0 3px; }
  footer { touch-action: manipulation; min-width: 0; }
  button, .source { display: inline-flex; align-items: center; justify-content: center; border: 1px solid #4c4b54; border-radius: 999px; background: #25252d; padding: .58rem .8rem; text-decoration: none; font-size: .8rem; white-space: nowrap; }
  .recommend { border-color: #d6fb65; background: #d6fb65; color: #161910; font-weight: 750; }
  .game-switcher { position: fixed; z-index: 4; right: max(12px, calc((100vw - 852px) / 2)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; width: 24px; border: 1px solid #ffffff30; border-radius: 10px; overflow: hidden; background: #19191e66; backdrop-filter: blur(8px); touch-action: none; }
  .game-switcher button { border: 0; border-radius: 0; background: transparent; width: 22px; height: 42px; padding: 0; color: #fff; }
  .game-switcher button + button { border-top: 1px solid #ffffff22; }
  .game-switcher button:active { background: #ffffff30; }
  .game-switcher button:disabled { opacity: .25; cursor: default; }
  .triangle { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; }
  .triangle.up { border-bottom: 6px solid currentColor; }

  .like { gap: 4px; font-variant-numeric: tabular-nums; }
  .like .heart { font-size: 23px; line-height: 1; }
  .like[aria-pressed="true"] { color: #ff4d6d; }
  .like-count { font-size: 12px; }

  .action-status:empty { display: none; }
  .actions { flex: 0 0 auto; gap: 6px; }
  .byline { min-width: 0; padding-block: 8px; color: #dedce4; font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-underline-offset: 3px; }
  .creator-page { max-width: 650px; height: 100dvh; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; margin: auto; padding: 24px 16px; }
  .creator-page header { margin-bottom: 40px; }
  .creator-page h1 { margin: 8px 0; font-size: clamp(1.8rem, 7vw, 2.8rem); }
  .creator-page .label { color: #d6fb65; font-size: .85rem; }
  .creator-page .note { color: #bbb9c3; line-height: 1.5; }
  .works { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; list-style: none; padding: 0; margin-top: 20px; }
  .works a { position: relative; display: block; aspect-ratio: 1; overflow: hidden; border: 1px solid #383841; border-radius: 8px; background: #1b1b23; text-decoration: none; }
  .works a:hover { border-color: #d6fb65; }
  .works img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .works .text-cover { display: grid; place-items: center; padding: 12px; background: radial-gradient(at 25% 15%, #35414b, #232330 72%); }
  .text-cover .work-title { position: static; padding: 0; background: none; text-align: center; }
  .work-title { position: absolute; inset: auto 0 0; padding: 28px 10px 10px; background: linear-gradient(transparent, #000e); font-size: clamp(.8rem, 3vw, 1.05rem); font-weight: 750; }
  @media (max-width: 420px) { .actions { gap: 4px; } .actions button, .actions .source { padding-inline: 8px; } .recommend { font-size: 12px; } }

  .game-viewport { min-height: 0; position: relative; overflow: hidden; }
  .game-viewport > .stage { width: 100%; height: 100%; }
  body.comments-open article { height: calc(100% - var(--comments-height)); }
  body.comments-open .game-switcher { top: calc((100dvh - var(--comments-height)) / 2); }
  .comments-sheet { position: fixed; z-index: 7; bottom: 0; left: 50%; width: min(900px,100%); height: min(48dvh,440px); background: #19191f; border: 1px solid #383841; border-bottom: 0; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; transform: translate(-50%,var(--drag-y,0px)); box-shadow: 0 -8px 30px #0004; animation: sheet-in .2s ease-out; padding-bottom: env(safe-area-inset-bottom); }
  @keyframes sheet-in { from { transform: translate(-50%,100%); } }
  .comments-grip { position: relative; flex-shrink: 0; text-align: center; padding: 20px 48px 12px; touch-action: none; cursor: grab; border-bottom: 1px solid #ffffff12; }
  .comments-grip::before { content: ''; position: absolute; width: 32px; height: 4px; border-radius: 3px; background: #777782; top: 8px; left: calc(50% - 16px); }
  .comments-grip h2 { margin: 0; font-size: 15px; }
  .comments-close { position: absolute; right: 10px; top: 14px; border: 0; background: transparent; padding: 4px 10px; font-size: 20px; }
  .comments-content { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 8px 18px; }
  .comments-list { list-style: none; margin: 0; padding: 0; }
  .comments-list li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 10px 0; }
  .comment-avatar { width: 30px; height: 30px; display: grid; place-items: center; background: #34343e; border-radius: 50%; font-size: 13px; }
  .comment-name { font-size: 13px; font-weight: 700; }
  .comment-time { color: #9997a3; font-size: 11px; margin-left: 8px; }
  .comment-body { margin: 5px 0 0; font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .comments-message { color: #bbb9c3; font-size: 13px; }
  .comments-form { display: flex; gap: 8px; flex-shrink: 0; padding: 12px; border-top: 1px solid #ffffff12; }
  .comments-form input { min-width: 0; flex: 1; border: 1px solid #42424d; border-radius: 22px; padding: 10px 14px; background: #25252d; color: inherit; font: inherit; font-size: 16px; touch-action: manipulation; }
  .comments-form button { border: 0; background: transparent; color: #d6fb65; }
  #login-dialog { width: min(360px,calc(100% - 32px)); border: 1px solid #3a3a43; border-radius: 20px; padding: 0; color: #faf8f2; background: #19191f; }
  #login-dialog::backdrop { background: #000a; backdrop-filter: blur(4px); }
  .login-box { padding: 24px; text-align: center; }
  .login-box h2 { margin: 0 0 8px; }
  .login-box p { color: #aaa8b3; font-size: 14px; line-height: 1.5; }
  #phuze-widget { min-height: 54px; text-align: left; margin-top: 18px; }
  .login-cancel { margin-top: 12px; border: 0; background: transparent; color: #aaa8b3; }
  @media(prefers-reduced-motion:reduce) { .comments-sheet { animation: none; } }
  article { grid-template-rows: minmax(0, 1fr); }
  article > footer { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); left: 16px; right: 16px; z-index: 4; padding: 10px; border-radius: 14px; background: #101014ed; visibility: hidden; pointer-events: none; }
  body.controls-visible article > footer { visibility: visible; pointer-events: auto; }
  .actions { flex-wrap: wrap; justify-content: flex-end; }
  .byline { flex-shrink: 0; }
  @media(max-width:420px) { article > footer { left: 10px; right: 10px; gap: 6px; padding: 8px; } .actions { gap: 4px; } .actions button,.actions a { padding: 8px 6px; font-size: 12px; } }
  .comments-button, .reaction { position: relative; overflow: visible; }
  .action-count { position: absolute; top: -7px; right: -5px; min-width: 17px; padding: 1px 4px; border: 1px solid #55545f; border-radius: 999px; background: #373640; color: #faf8f2; font-size: 10px; font-weight: 700; line-height: 14px; font-variant-numeric: tabular-nums; pointer-events: none; }
  .reaction[aria-pressed="true"] .action-count { background: #d6fb65; color: #101014; border-color: #d6fb65; }

  :root{--orange:#ff8b3d;--orange-light:#ffb46c;--cream:#fff3df;--ink:#482515}
  .feed-brand{padding:12px 16px;background:var(--orange);color:var(--ink);border-radius:0 0 22px 22px;box-shadow:0 8px 24px #0003}
  .feed-brand .brand{font-size:24px}.feed-brand .brand span{color:var(--cream)}
  .nav-actions{gap:10px}.search-button,.account-link{width:44px;height:44px}.account-link{background:var(--cream);color:var(--ink);font-weight:800}
  article>footer{padding:14px 12px;background:#ff8b3df5;color:var(--ink);border:1px solid #ffbd83;border-radius:22px;box-shadow:0 8px 28px #0004;gap:10px}
  .byline{color:var(--ink);font-size:14px;flex:0 0 auto}.actions{flex:1;flex-wrap:nowrap;gap:10px}
  .actions button{min-width:60px;min-height:48px;padding:12px 14px;border:0;background:var(--cream);color:var(--ink);font-size:16px;font-weight:700;flex:1}
  .actions .reaction[aria-pressed=true]{background:var(--ink);color:var(--cream)}
  .action-count{top:-8px;right:-4px;min-width:21px;font-size:11px;line-height:17px;background:var(--ink);color:var(--cream);border-color:var(--orange)}
  .game-switcher{width:24px;border-radius:11px;border:1px solid #ffbc8460;background:#ff8b3d7a;box-shadow:0 4px 18px #0002;backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%)}
  .game-switcher button{width:22px;height:52px;color:var(--ink)}.game-switcher button+button{border-color:#71350f30}.game-switcher button:active{background:#ffb46ca6}
  .triangle{border-left-width:4px;border-right-width:4px}.triangle.up{border-bottom-width:7px}.triangle.down{border-top-width:7px}#toggle-controls svg{width:14px;height:14px}
  .game-more{width:42px;height:38px;font-size:28px}body.controls-visible .game-more{bottom:100px}#delete-game{margin-top:8px;background:#4c2025;color:#ffd4c8;border-color:#8b4345}
  .save-hint{position:fixed;z-index:8;right:20px;top:80px;width:min(300px,calc(100vw - 32px));padding:20px;background:var(--cream);color:var(--ink);border:1px solid #ffbd83;border-radius:18px;box-shadow:0 12px 36px #0007;touch-action:manipulation}
  .save-hint::before{content:'';position:absolute;top:-8px;right:18px;width:14px;height:14px;transform:rotate(45deg);background:var(--cream);border-left:1px solid #ffbd83;border-top:1px solid #ffbd83}
  .save-hint h2{font-size:18px;margin-right:20px}.save-hint p{font-size:14px;line-height:1.6;margin:10px 0 16px}.save-hint button{border:0;background:var(--orange);color:var(--ink);font-weight:700;font-size:14px}
  .save-hint .hint-close{position:absolute;right:10px;top:8px;background:none;font-size:22px;padding:4px 8px}.save-highlight{outline:3px solid var(--cream);outline-offset:5px;box-shadow:0 0 0 10px #ff8b3d80}
  @media(max-width:420px){article>footer{left:10px;right:10px;padding:12px 10px;gap:8px}.actions{gap:8px}.actions button{padding:12px 8px;font-size:15px;min-width:58px}.feed-brand{left:10px;right:10px}.byline{font-size:13px}}

<body>
<dialog id="login-dialog" aria-labelledby="login-heading"><div class="login-box"><h2 id="login-heading">免密碼信箱登入</h2><p>輸入 Email，點信裡的連結就完成登入。登入後可以留言及儲存遊戲。</p><div id="phuze-widget"></div><button class="login-cancel" type="button" data-close-login>先逛逛</button></div></dialog>
<dialog class="search-dialog" aria-label="搜尋遊戲">
  <form method="dialog"><input type="search" id="game-search" aria-label="遊戲關鍵字" placeholder="搜尋遊戲、作者" autocomplete="off"><button aria-label="關閉搜尋">關閉</button></form>
  <p id="search-status" role="status"></p>
  <ul class="search-results"></ul>
</dialog>
<dialog id="report-menu" class="report-dialog" aria-label="遊戲選項">
  <button type="button" id="delete-game" hidden>刪除遊戲</button>
  <button type="button" id="open-report">檢舉遊戲</button>
  <div class="dialog-actions"><button type="button" data-close>取消</button></div>
</dialog>
<dialog id="report-dialog" class="report-dialog" aria-labelledby="report-heading">
  <h2 id="report-heading">檢舉遊戲</h2>
  <form id="report-form">
    <label><input type="radio" name="reason" value="not_playable" required> 無法載入或操作</label>
    <label><input type="radio" name="reason" value="inappropriate"> 內容不適合</label>
    <label><input type="radio" name="reason" value="attribution"> 作者或版權問題</label>
    <label><input type="radio" name="reason" value="other"> 其他</label>
    <label>補充說明（選填）<textarea name="details" maxlength="1000" rows="3"></textarea></label>
    <p id="report-message" role="status"></p>
    <div class="dialog-actions"><button type="button" data-close>取消</button><button class="report-submit" type="submit">送出檢舉</button></div>
  </form>
</dialog>
<section id="comments-sheet" class="comments-sheet" role="region" aria-labelledby="comments-heading" hidden>
  <div class="comments-grip" aria-label="向下拖曳收起留言"><h2 id="comments-heading">留言</h2><button class="comments-close" type="button" aria-label="關閉留言">×</button></div>
  <div class="comments-content"><p class="comments-message" role="status"></p><ul class="comments-list"></ul></div>
  <form class="comments-form"><input name="comment" aria-label="新增留言" placeholder="登入後留言…" maxlength="1000" required autocomplete="off"><button type="submit">發送</button></form>
</section>
<div class="feed-shell"><main id="feed" aria-label="PlayFeed 遊戲牆"></main>
<aside class="feed-rail" aria-label="會員、搜尋與遊戲切換">
 <nav class="rail-tools" aria-label="帳號與搜尋"><a class="account-link" href="/account.html" aria-label="我的頁面"></a><button class="search-button" aria-label="搜尋遊戲" type="button"><span class="magnifier" aria-hidden="true"></span></button></nav>
 <nav class="game-switcher" aria-label="切換遊戲，可上下滑動">
  <button id="previous-game" type="button" aria-label="上一款"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg><span class="switch-label">上一款</span></button>
  <button id="next-game" type="button" aria-label="下一款"><span class="switch-label">下一款</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 10 6 6 6-6"/></svg></button>
 </nav>
 <a class="feed-logo" href="/" aria-label="PlayFeed，重新整理遊戲"><span>pf<span class="logo-dot">.</span></span></a>
</aside></div>
<div class="action-status" role="status" aria-live="polite"></div>
<main id="creator" class="creator-page" aria-labelledby="creator-name" hidden>
  <header><span class="brand">Play<span>Feed</span></span><a class="source" id="back-to-feed" href="#stay-on-track">← 回遊戲牆</a></header>
  <span class="label">創作者作品集</span>

      const fit = () => {
        const landscape = landscapeFeed.matches;
        const frameWidth = landscape ? Math.max(width,height) : width;
        const frameHeight = landscape ? Math.min(width,height) : height;
        const scale = Math.min(stage.clientWidth / frameWidth, stage.clientHeight / frameHeight, 1);
        if (nativeSize) {
          frame.style.width = Math.floor(frameWidth * scale) + 'px';
          frame.style.height = Math.floor(frameHeight * scale) + 'px';
        } else {
          frame.style.width = frameWidth + 'px';
          frame.style.height = frameHeight + 'px';
          frame.style.setProperty('--game-scale', scale);
        }
      };
      fit();
      gameResizeObserver = new ResizeObserver(fit);
      gameResizeObserver.observe(stage);
    }
    const version = gameLoadVersion;
    stage.querySelector('.empty').textContent = '載入遊戲中…';
    // Let the navigation paint first. A later choice cancels this pending load.
    gameLoadFrame = requestAnimationFrame(() => {
      gameLoadTimer = setTimeout(() => {
        if (version !== gameLoadVersion || activeIndex !== index) return;
        stage.replaceChildren(frame);
        frame.src = new URL(game.url, location.origin + "/").href;
      }, 0);
    });
    const url = new URL(location.href);
    url.pathname = "/g/" + encodeURIComponent(game.id);
    url.search = "";
    url.hash = "";
    if (location.href !== url.href) history.replaceState(null, '', url);
  }

  function gameFromLink(entrySource) {
    const profile = profiles.get(location.hash);
    feed.hidden = Boolean(profile);
    creatorPage.hidden = !profile;
    shell.hidden = Boolean(profile);
    if (profile) {
      backToFeed.href = '#' + (games[activeIndex]?.id ?? profile.games[0].id);
      renderProfile(profile);
      unmountGame();
      return;
    }
    if(!games.length){feed.replaceChildren();const empty=document.createElement('p');empty.className='empty';empty.textContent=catalogError?'遊戲清單暫時無法載入，請重新整理。':'目前沒有可遊玩的遊戲';feed.append(empty);return;}
    const requestedId = ignoreGameLinkOnReload ? '' : (location.hash.slice(1) || (location.pathname.startsWith('/g/') ? decodeURIComponent(location.pathname.slice(3)) : new URLSearchParams(location.search).get('id')));
    ignoreGameLinkOnReload=false;
    const index = games.findIndex(game => game.id === requestedId);
    const target = Math.max(index, 0);
    const source=typeof entrySource==='string'?entrySource:pendingEntrySource||(firstGameEntry?undefined:'internal_selection');
    pendingEntrySource=null;firstGameEntry=false;
    showGame(target,source);
  }

  gameFromLink();
  window.addEventListener('hashchange', gameFromLink);
  document.addEventListener('click',event=>{if(event.target.closest('.works a,#back-to-feed'))pendingEntrySource='creator_selection';},true);
  function switchGame(direction) {
    const target = activeIndex + direction;
    if (target < 0 || target >= games.length) return;
    window.PlayFeedAnalytics?.event(direction<0?'previous_game':'next_game');
    showGame(target,direction<0?'previous':'next');

  }
  let gesture=null,suppressClickUntil=0;
  switcher.addEventListener('pointerdown',event=>{
    if(!event.isPrimary||event.button!==0)return;
    const middle=switcher.getBoundingClientRect().top+switcher.clientHeight/2;
    const button=event.target.closest('button')||(event.clientY<middle?previousButton:nextButton);
    event.preventDefault();
    button.focus({preventScroll:true});
    gesture={id:event.pointerId,y:event.clientY,button,moved:false};
    switcher.setPointerCapture(event.pointerId);
  });
  switcher.addEventListener('pointermove',event=>{
    if(!gesture||gesture.id!==event.pointerId)return;
    if(Math.abs(event.clientY-gesture.y)>10)gesture.moved=true;
  });
  switcher.addEventListener('pointerup',event=>{
    if(!gesture||gesture.id!==event.pointerId)return;
    const {y,button,moved}=gesture;gesture=null;
    const distance=event.clientY-y;
    suppressClickUntil=performance.now()+500;
    if(switcher.hasPointerCapture(event.pointerId))switcher.releasePointerCapture(event.pointerId);
    if(Math.abs(distance)>=32)switchGame(distance<0?1:-1);
    else if(!moved)switchGame(button===previousButton?-1:1);
  });
  switcher.addEventListener('pointercancel',()=>gesture=null);
  for(const [button,direction]of [[previousButton,-1],[nextButton,1]])button.addEventListener('click',event=>{
    if(performance.now()<suppressClickUntil)return;
    // Keyboard and assistive-technology activation emits a click without a pointer gesture.
    if(event.detail===0)switchGame(direction);
  });
  let lastWheel=0;
  switcher.addEventListener('wheel',event=>{
    if(event.ctrlKey)return;event.preventDefault();
    if(Math.abs(event.deltaY)<8||performance.now()-lastWheel<400)return;
    lastWheel=performance.now();switchGame(event.deltaY>0?1:-1);
  },{passive:false});
  document.addEventListener('gesturestart', event => event.preventDefault(), { passive: false });
  document.addEventListener('wheel', event => { if (event.ctrlKey) event.preventDefault(); }, { passive: false });

  PlayFeedAuth.onChange(() => {
    if (activeIndex >= 0) loadEngagement(games[activeIndex], cards[activeIndex]);
  });
</script>
</body>
</html>
