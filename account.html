<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的 PlayFeed</title>
<meta name="playfeed-auth-bootstrap" content="collection">
<style>
  *{box-sizing:border-box}body{margin:0;background:#101014;color:#faf8f2;font:15px system-ui,sans-serif;min-height:100dvh}a{color:inherit}.shell{max-width:900px;margin:auto;padding:20px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900;text-decoration:none}.brand span{color:#d6fb65}.profile{display:flex;align-items:center;gap:16px;margin:42px 0 30px}.avatar{width:76px;height:76px;border-radius:50%;background:#d6fb65;color:#101014;display:grid;place-items:center;font-size:30px;font-weight:900}.identity h1{margin:0 0 5px;font-size:22px}.identity p{margin:0;color:#aaa8b3}.button{border:0;border-radius:999px;padding:9px 16px;background:#2b2b33;color:inherit}.tabs{display:flex;gap:4px;border-bottom:1px solid #2d2d35}.tabs button{flex:1;border:0;background:none;color:#9997a3;padding:14px 6px}.tabs button.active{color:#fff;border-bottom:2px solid #d6fb65}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding-top:3px}.tile{position:relative;aspect-ratio:9/16;background:#202029;overflow:hidden;text-decoration:none;display:flex;align-items:flex-end;padding:12px}.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tile::after{content:'';position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#000c)}.tile span{position:relative;z-index:1;font-weight:800;line-height:1.25}.empty{grid-column:1/-1;color:#9997a3;text-align:center;padding:70px 20px}dialog{width:min(360px,calc(100% - 32px));border:1px solid #3a3a43;border-radius:20px;padding:24px;color:#fff;background:#19191f;text-align:center}dialog::backdrop{background:#000b}#phuze-widget{min-height:54px;text-align:left;margin:18px 0}.cancel{border:0;background:none;color:#aaa8b3}@media(max-width:520px){.shell{padding-left:12px;padding-right:12px}.profile{margin-top:30px}.avatar{width:66px;height:66px}}
.identity{min-width:0}.identity p{white-space:pre-wrap;overflow-wrap:anywhere}.profile-site{display:block;margin-top:10px;color:#d6fb65;overflow-wrap:anywhere}label{display:block;text-align:left;margin:14px 0}input,textarea{display:block;box-sizing:border-box;width:100%;margin-top:6px;padding:10px;border:1px solid #555;border-radius:8px;background:#25252d;color:inherit;font:inherit}.tile{aspect-ratio:390/700}.tile:focus-visible,.button:focus-visible{outline:2px solid #d6fb65}#notifications a{display:block;padding:12px;border:1px solid #444;border-radius:10px;margin-bottom:8px}#notifications .unread{border-color:#d6fb65}.review-row{padding:12px;border-bottom:1px solid #444;overflow-wrap:anywhere}.review-row button{margin:8px 8px 0 0}.profile-settings{margin-left:auto;flex-shrink:0;width:44px;height:44px;display:grid;place-items:center;border:1px solid #48424a;border-radius:50%;background:#262329;color:#ffad66;cursor:pointer}.profile-settings[hidden]{display:none}.profile-settings:hover{background:#3d2c25}.recommend-button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 22px;border-radius:999px;background:#ff8b3d;color:#482515;text-decoration:none;font-weight:750}.recommend-button:hover{background:#ffac65}.profile-settings:focus-visible,.recommend-button:focus-visible{outline:2px solid #ffb46c;outline-offset:4px}.backup-note{margin:18px 0;padding:14px 16px;border:1px solid #4b4338;border-radius:14px;background:#29251f;line-height:1.65}.backup-note p{margin:0 0 10px;color:#c9bda9}.backup-note[hidden]{display:none}.backup-note .button{background:#e8b17e;color:#402815;font-weight:700}</style>
<main class="shell">
  <header class="top"><a class="brand" href="/">Play<span>Feed</span></a><button id="session-action" class="button" type="button">登入</button></header>
  <section class="profile"><div class="avatar">?</div><div class="identity"><h1>我的頁面</h1><p>收藏保存在此瀏覽器</p></div><button id="edit-profile" class="profile-settings" type="button" aria-label="編輯個人資料" title="編輯個人資料" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 3-.7 2.1-1.4.8-2.2-.4-2.5 4.3 1.5 1.7v1.6l-1.5 1.7 2.5 4.3 2.2-.4 1.4.8.7 2.1h5l.7-2.1 1.4-.8 2.2.4 2.5-4.3-1.5-1.7v-1.6l1.5-1.7-2.5-4.3-2.2.4-1.4-.8-.7-2.1z"/><circle cx="12" cy="12" r="3.5"/></svg></button></section>
  <aside class="backup-note" id="backup-note"><p id="backup-copy">收藏保存在此瀏覽器；清除網站資料或換瀏覽器後無法取回。登入可備份、跨裝置使用。</p><button class="button" id="backup-action" type="button">登入備份收藏</button></aside>
  <p><a class="recommend-button" href="/submit.html">＋ 推薦新遊戲</a></p><section id="notifications" aria-label="通知"></section><section id="review" hidden><h2>待審核推薦</h2><div id="review-list"></div></section><nav class="tabs"><button class="active" data-tab="saved">儲存</button><button data-tab="recommended">我推薦的</button></nav>
  <section class="grid" aria-live="polite"><p class="empty">正在載入…</p></section>
</main>
<dialog id="login-dialog"><h2>免密碼信箱登入</h2><p>輸入 Email，點信裡的連結就完成登入。</p><div id="phuze-widget"></div><button class="cancel" type="button" data-close-login>取消</button></dialog>
<dialog id="profile-dialog"><form id="profile-form"><h2>編輯個人資料</h2><label>暱稱<input name="displayName" required maxlength="40"></label><label>會員介紹<textarea name="bio" maxlength="300" rows="4"></textarea></label><label>連結<input name="website" type="url" maxlength="500" placeholder="https://"></label><p id="profile-status" role="status"></p><button class="button" type="submit">儲存</button><button class="button" type="button" id="cancel-profile">取消</button></form></dialog><script src="/auth.js"></script><script src="/saves.js"></script><script src="/analytics.js"></script><script src="/analytics-owner-link.js" defer></script><script src="/recommendations.js"></script><script src="/catalog.js"></script>
<script>
let tab='saved', collection=null, games=[], loadVersion=0;
try {
 const cached=JSON.parse(sessionStorage.getItem('playfeed:catalog:v1')||'null');
 if(cached&&Date.now()-cached.time<1800000&&Array.isArray(cached.games))games=cached.games.filter(game=>typeof game.id==='string'&&typeof game.url==='string');
} catch {}
const grid=document.querySelector('.grid'), avatar=document.querySelector('.avatar'), title=document.querySelector('.identity h1'), subtitle=document.querySelector('.identity p'), sessionAction=document.querySelector('#session-action');
function render(){
  grid.replaceChildren();
  const local=PlayFeedSaves.list();
  if(PlayFeedAuth.checking&&!local.length){const p=document.createElement('p');p.className='empty';p.textContent='正在載入我的頁面…';grid.append(p);return;}
  if(tab==='recommended'&&!PlayFeedAuth.user){const p=document.createElement('p');p.className='empty';p.textContent='登入後可推薦遊戲、查看推薦進度。';grid.append(p);return;}
  if(tab==='recommended'&&!collection){const p=document.createElement('p');p.className='empty';p.textContent='正在載入…';grid.append(p);return;}
  let entries=[];
  if(tab==='recommended') {
    entries=collection.requests.map(row=>({title:new URL(row.url).hostname,url:row.url,id:row.published_game_id||row.id,status:row.status}));
    for(const row of collection.recommendations){const entry=entries.find(item=>item.url===row.url);if(entry)Object.assign(entry,{title:row.title,id:row.id,status:'approved'});else entries.push({...row,status:'approved'});}
  }
  else {const keys=new Set([...(collection?.actions||[]).filter(row=>row.kind==='save').map(row=>row.game_key),...local.map(game=>game.url)]);entries=(games.length?games:local).filter(game=>keys.has(new URL(game.url,location.origin+'/').href));}
  for(const game of entries){
    const a=document.createElement('a');a.className='tile';
    const match=games.find(entry=>new URL(entry.url,location.origin).href===new URL(game.url,location.origin).href);
    const preview=match||game;
    a.href=tab==='recommended'?game.url:'/#'+encodeURIComponent(preview.id);
    if(tab==='recommended'){a.target='_blank';a.rel='noopener noreferrer';}
    a.setAttribute('aria-label',game.title);
    const img=document.createElement('img');
    img.alt='';img.loading='lazy';img.decoding='async';img.width=390;img.height=700;
    img.referrerPolicy='no-referrer';
    // The thumbnail service returns a cached, non-animated screenshot.
    // No game page or scripts are executed in this grid.
    const screenshot='https://image.thum.io/get/noanimate/width/390/maxAge/168/?url='+encodeURIComponent(new URL(preview.url,location.origin).href);
    const sources=[...new Set([preview.cover,preview.screenshot,screenshot,'/share-cards/'+encodeURIComponent(preview.id)+'.png','/share-cards/default.png'].filter(Boolean))];
    let sourceIndex=0;
    img.addEventListener('error',()=>{sourceIndex++;if(sourceIndex<sources.length)img.src=sources[sourceIndex];else img.remove()});
    img.src=sources[0];a.append(img);
    const span=document.createElement('span');span.textContent=game.title+(game.status?' · '+({pending:'待審核',approved:'已上架',rejected:'暫不上架'}[game.status]||''): '');a.append(span);grid.append(a);
  }
  if(!entries.length){const p=document.createElement('p');p.className='empty';p.textContent=PlayFeedAuth.user&&!collection?'正在載入收藏…':tab==='saved'?'還沒有收藏，回遊戲牆按下儲存，就能在這裡找到。':'這裡還沒有遊戲。';grid.append(p)}
}
function updateBackup(){
 const user=PlayFeedAuth.user,note=document.querySelector('#backup-note');
 note.hidden=Boolean(user)&&!PlayFeedSaves.error;
 document.querySelector('#backup-copy').textContent=PlayFeedSaves.error||'收藏保存在此瀏覽器；清除網站資料或換瀏覽器後無法取回。登入可備份、跨裝置使用。';
 document.querySelector('#backup-action').textContent=user?'重試同步':'登入備份收藏';
 if(!user){title.textContent='我的收藏';avatar.textContent='☆';subtitle.textContent='此瀏覽器已儲存 '+PlayFeedSaves.list().length+' 款遊戲'}
}
window.addEventListener('playfeed:saves-change',event=>{updateBackup();render();if(event.detail.reason==='merged'&&PlayFeedAuth.user&&collection)loadCollection()});
document.querySelector('#backup-action').addEventListener('click',async()=>{if(PlayFeedAuth.user){await PlayFeedSaves.merge();updateBackup()}else PlayFeedAuth.openLogin()});
async function loadCollection(){
 const version=++loadVersion;
 try{
  await PlayFeedSaves.merge();
  const result=PlayFeedAuth.takeCollection?.()||await PlayFeedAuth.api('/api/account?action=collection');
  if(version!==loadVersion||!PlayFeedAuth.user)return;
  collection=result;
  title.textContent=result.profile.display_name;subtitle.textContent=result.profile.bio||'我的遊戲收藏';
  avatar.textContent=Array.from(result.profile.display_name)[0].toUpperCase();
  document.querySelector('.profile-site')?.remove();
  if(result.profile.website){const link=document.createElement('a');link.className='profile-site';link.href=result.profile.website;link.textContent=result.profile.website;link.target='_blank';link.rel='noopener noreferrer';document.querySelector('.identity').append(link)}
  const notifications=document.querySelector('#notifications');notifications.replaceChildren();
  for(const item of result.notifications){const a=document.createElement('a');const recommended=result.recommendations.find(r=>r.id===item.game_id);const listed=recommended&&games.find(g=>new URL(g.url,location.origin).href===recommended.url);a.href='/#'+encodeURIComponent(listed?.id||item.game_id);a.textContent='你的推薦「'+item.title+'」已上架！';if(!item.read_at)a.className='unread';a.addEventListener('click',()=>PlayFeedAuth.api('/api/account',{method:'POST',body:JSON.stringify({action:'read-notifications'})}).catch(()=>{}));notifications.append(a)}
  const pending=result.requests.filter(row=>row.status==='pending').length;
  if(pending){const p=document.createElement('p');p.textContent=pending+' 款推薦等待管理者審核。';notifications.append(p)}
  document.querySelector('#review').hidden=!result.isAdmin;
  if(result.isAdmin)loadReview();
  render();
 }catch(error){if(version!==loadVersion)return;const p=document.createElement('p');p.className='empty';p.textContent=error.message;grid.replaceChildren(p)}
}
for(const button of document.querySelectorAll('[data-tab]'))button.addEventListener('click',()=>{tab=button.dataset.tab;document.querySelector('.tabs .active').classList.remove('active');button.classList.add('active');render()});
sessionAction.addEventListener('click',async()=>{if(PlayFeedAuth.user)await PlayFeedAuth.logout();else PlayFeedAuth.openLogin()});
PlayFeedAuth.onChange(async user=>{sessionAction.textContent=user?'登出':'登入';avatar.textContent=user?.email?.[0]?.toUpperCase()||'?';title.textContent=user?.email?.split('@')[0]||'我的頁面';subtitle.textContent=user?.email||'登入後查看收藏與推薦';loadVersion++;collection=null;document.querySelector('.profile-site')?.remove();document.querySelector('#notifications').replaceChildren();document.querySelector('#review').hidden=true;document.querySelector('#review-list').replaceChildren();document.querySelector('#profile-dialog').close();document.querySelector('#edit-profile').hidden=!user;updateBackup();render();if(user)loadCollection()});
loadPlayfeedGames().then(value=>{games=value;try{sessionStorage.setItem('playfeed:catalog:v1',JSON.stringify({time:Date.now(),games}))}catch{}render()});

const profileDialog=document.querySelector('#profile-dialog'),profileForm=document.querySelector('#profile-form');
document.querySelector('#edit-profile').addEventListener('click',()=>{
 if(!collection)return;
 profileForm.elements.displayName.value=collection.profile.display_name;
 profileForm.elements.bio.value=collection.profile.bio;
 profileForm.elements.website.value=collection.profile.website;
 document.querySelector('#profile-status').textContent='';profileDialog.showModal();
});
document.querySelector('#cancel-profile').addEventListener('click',()=>profileDialog.close());
profileForm.addEventListener('submit',async event=>{
 event.preventDefault();const button=profileForm.querySelector('[type=submit]');button.disabled=true;
 try{await PlayFeedAuth.api('/api/account',{method:'POST',body:JSON.stringify({action:'profile',displayName:profileForm.elements.displayName.value,bio:profileForm.elements.bio.value,website:profileForm.elements.website.value})});profileDialog.close();await loadCollection()}
 catch(error){document.querySelector('#profile-status').textContent=error.message}finally{button.disabled=false}
});
async function loadReview(){
 try{
 const result=await PlayFeedAuth.api('/api/account?action=review');
 if(!collection?.isAdmin)return;
 const list=document.querySelector('#review-list');list.replaceChildren();
 for(const request of result.requests){
  const row=document.createElement('div');row.className='review-row';
  const a=document.createElement('a');a.href=request.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=request.url;row.append(a);
  const preview=document.createElement('a');preview.href='/submit.html?request='+encodeURIComponent(request.id)+'&game='+encodeURIComponent(request.url);preview.textContent='預覽試玩與審核';preview.className='button';row.append(preview);
  for(const [decision,label]of[['reject','不予上架']]){
   const button=document.createElement('button');button.className='button';button.textContent=label;
   button.addEventListener('click',async()=>{row.querySelectorAll('button').forEach(b=>b.disabled=true);try{await PlayFeedAuth.api('/api/account',{method:'POST',body:JSON.stringify({action:'review',requestId:request.id,decision,title:input.value})});await loadCollection()}catch(error){const status=document.createElement('p');status.textContent=error.message;row.append(status);row.querySelectorAll('button').forEach(b=>b.disabled=false)}});row.append(button)
  }
  list.append(row)
 }
 if(!result.requests.length)list.textContent='目前沒有待審核推薦。';
 }catch(error){document.querySelector('#review-list').textContent=error.message}
}
</script>
</html>
