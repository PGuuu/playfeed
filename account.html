<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的 PlayFeed</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#101014;color:#faf8f2;font:15px system-ui,sans-serif;min-height:100dvh}a{color:inherit}.shell{max-width:900px;margin:auto;padding:20px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900;text-decoration:none}.brand span{color:#d6fb65}.profile{display:flex;align-items:center;gap:16px;margin:42px 0 30px}.avatar{width:76px;height:76px;border-radius:50%;background:#d6fb65;color:#101014;display:grid;place-items:center;font-size:30px;font-weight:900}.identity h1{margin:0 0 5px;font-size:22px}.identity p{margin:0;color:#aaa8b3}.button{border:0;border-radius:999px;padding:9px 16px;background:#2b2b33;color:inherit}.tabs{display:flex;gap:4px;border-bottom:1px solid #2d2d35}.tabs button{flex:1;border:0;background:none;color:#9997a3;padding:14px 6px}.tabs button.active{color:#fff;border-bottom:2px solid #d6fb65}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding-top:3px}.tile{position:relative;aspect-ratio:9/16;background:#202029;overflow:hidden;text-decoration:none;display:flex;align-items:flex-end;padding:12px}.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tile::after{content:'';position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#000c)}.tile span{position:relative;z-index:1;font-weight:800;line-height:1.25}.empty{grid-column:1/-1;color:#9997a3;text-align:center;padding:70px 20px}dialog{width:min(360px,calc(100% - 32px));border:1px solid #3a3a43;border-radius:20px;padding:24px;color:#fff;background:#19191f;text-align:center}dialog::backdrop{background:#000b}#phuze-widget{min-height:54px;text-align:left;margin:18px 0}.cancel{border:0;background:none;color:#aaa8b3}@media(max-width:520px){.shell{padding-left:12px;padding-right:12px}.profile{margin-top:30px}.avatar{width:66px;height:66px}}
</style>
<main class="shell">
  <header class="top"><a class="brand" href="/">Play<span>Feed</span></a><button id="session-action" class="button" type="button">登入</button></header>
  <section class="profile"><div class="avatar">?</div><div class="identity"><h1>我的頁面</h1><p>登入後查看收藏與推薦</p></div></section>
  <nav class="tabs"><button class="active" data-tab="saved">儲存</button><button data-tab="liked">按讚</button><button data-tab="recommended">我推薦的</button></nav>
  <section class="grid" aria-live="polite"><p class="empty">正在載入…</p></section>
</main>
<dialog id="login-dialog"><h2>登入 PlayFeed</h2><p>輸入 Email，點信裡的連結就完成登入。</p><div id="phuze-widget"></div><button class="cancel" type="button" data-close-login>取消</button></dialog>
<script src="https://phuze.edato.me/phuze.js"></script><script src="/auth.js"></script><script src="/recommendations.js"></script><script src="/catalog.js"></script>
<script>
let tab='saved', collection=null, games=[];
const grid=document.querySelector('.grid'), avatar=document.querySelector('.avatar'), title=document.querySelector('.identity h1'), subtitle=document.querySelector('.identity p'), sessionAction=document.querySelector('#session-action');
function render(){
  grid.replaceChildren();
  if(!PlayFeedAuth.user){const p=document.createElement('p');p.className='empty';p.textContent='登入後，就能在這裡看到你儲存和按讚的遊戲。';grid.append(p);return;}
  if(!collection){const p=document.createElement('p');p.className='empty';p.textContent='正在載入…';grid.append(p);return;}
  let entries=[];
  if(tab==='recommended') entries=collection.recommendations.map(row=>({title:row.title||new URL(row.url).hostname,url:row.url,id:row.id}));
  else {const keys=new Set(collection.actions.filter(row=>row.kind===(tab==='liked'?'like':'save')).map(row=>row.game_key));entries=games.filter(game=>keys.has(new URL(game.url,location.origin+'/').href));}
  for(const game of entries){const a=document.createElement('a');a.className='tile';a.href=game.id?'/#'+game.id:game.url;if(game.cover){const img=document.createElement('img');img.src=game.cover;img.alt='';a.append(img)}const span=document.createElement('span');span.textContent=game.title;a.append(span);grid.append(a)}
  if(!entries.length){const p=document.createElement('p');p.className='empty';p.textContent='這裡還沒有遊戲。';grid.append(p)}
}
async function loadCollection(){try{collection=await PlayFeedAuth.api('/api/account?action=collection');render()}catch(error){grid.innerHTML='<p class="empty">'+error.message+'</p>'}}
for(const button of document.querySelectorAll('[data-tab]'))button.addEventListener('click',()=>{tab=button.dataset.tab;document.querySelector('.tabs .active').classList.remove('active');button.classList.add('active');render()});
sessionAction.addEventListener('click',async()=>{if(PlayFeedAuth.user)await PlayFeedAuth.logout();else PlayFeedAuth.openLogin()});
PlayFeedAuth.onChange(async user=>{sessionAction.textContent=user?'登出':'登入';avatar.textContent=user?.email?.[0]?.toUpperCase()||'?';title.textContent=user?.email?.split('@')[0]||'我的頁面';subtitle.textContent=user?.email||'登入後查看收藏與推薦';collection=null;render();if(user)loadCollection()});
loadPlayfeedGames().then(value=>{games=value;render()});
</script>
</html>
