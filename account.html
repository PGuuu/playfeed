<style>
  *{box-sizing:border-box}body{margin:0;background:#101014;color:#faf8f2;font:15px system-ui,sans-serif;min-height:100dvh}a{color:inherit}.shell{max-width:900px;margin:auto;padding:20px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900;text-decoration:none}.brand span{color:#d6fb65}.profile{display:flex;align-items:center;gap:16px;margin:24px 0 18px}.avatar{width:76px;height:76px;border-radius:50%;background:#d6fb65;color:#101014;display:grid;place-items:center;font-size:30px;font-weight:900}.identity h1{margin:0 0 5px;font-size:22px}.identity p{margin:0;color:#aaa8b3}.button{border:0;border-radius:999px;padding:9px 16px;background:#2b2b33;color:inherit}.tabs{display:flex;gap:4px;border-bottom:1px solid #2d2d35}.tabs button{flex:1;border:0;background:none;color:#9997a3;padding:14px 6px}.tabs button.active{color:#fff;border-bottom:2px solid #d6fb65}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding-top:3px}.tile{position:relative;aspect-ratio:9/16;background:#202029;overflow:hidden;text-decoration:none;display:flex;align-items:flex-end;padding:12px}.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tile::after{content:'';position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#000c)}.tile span{position:relative;z-index:1;font-weight:800;line-height:1.25}.empty{grid-column:1/-1;color:#9997a3;text-align:center;padding:70px 20px}dialog{width:min(360px,calc(100% - 32px));border:1px solid #3a3a43;border-radius:20px;padding:24px;color:#fff;background:#19191f;text-align:center}dialog::backdrop{background:#000b}#phuze-widget{min-height:54px;text-align:left;margin:18px 0}.cancel{border:0;background:none;color:#aaa8b3}@media(max-width:520px){.shell{padding-left:12px;padding-right:12px}.profile{margin-top:20px}.avatar{width:66px;height:66px}}
.identity{min-width:0}.identity p{white-space:pre-wrap;overflow-wrap:anywhere}.profile-site{display:block;margin-top:10px;color:#d6fb65;overflow-wrap:anywhere}label{display:block;text-align:left;margin:14px 0}input,textarea{display:block;box-sizing:border-box;width:100%;margin-top:6px;padding:10px;border:1px solid #555;border-radius:8px;background:#25252d;color:inherit;font:inherit}.tile{aspect-ratio:390/700}.tile:focus-visible,.button:focus-visible{outline:2px solid #d6fb65}#notifications a{display:block;padding:12px;border:1px solid #444;border-radius:10px;margin-bottom:8px}#notifications .unread{border-color:#d6fb65}.review-row{padding:12px;border-bottom:1px solid #444;overflow-wrap:anywhere}.review-row button{margin:8px 8px 0 0}.recommend-button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 22px;border-radius:999px;background:#ff8b3d;color:#482515;text-decoration:none;font-weight:750}.recommend-button:hover{background:#ffac65}.recommend-button:focus-visible{outline:2px solid #ffb46c;outline-offset:4px}.backup-note{margin:12px 0;padding:14px 16px;border:1px solid #4b4338;border-radius:14px;background:#29251f;line-height:1.65}.backup-note p{margin:0 0 10px;color:#c9bda9}.backup-note[hidden]{display:none}.backup-note .button{background:#e8b17e;color:#402815;font-weight:700}#backup-note{padding:6px 8px;background:#29251f;border-color:#4b4338}#phuze-inline-widget .phuze-input::placeholder{color:#a79d8e;opacity:1;font-size:16px}#phuze-inline-widget .phuze-input:focus{outline:2px solid #e8b17e;outline-offset:-2px}#phuze-inline-widget .phuze-inline-status:empty{display:none}#phuze-inline-widget .phuze-inline-status{margin:8px 8px 6px;color:#d4c4ae;font-size:12px!important}#phuze-inline-widget .phuze-btn:disabled{opacity:.65}#backup-note #backup-copy{margin:8px}#backup-note #backup-action{margin:0 8px 8px}@media(max-width:520px){#phuze-inline-widget .phuze-input::placeholder{color:transparent}#phuze-inline-widget .phuze-form:has(input:placeholder-shown):not(:focus-within)::before{content:attr(data-email-hint);position:absolute;left:12px;right:96px;top:50%;transform:translateY(-50%);font-size:12px;line-height:18px;color:#a79d8e;pointer-events:none}}

<script>
const publicProfileId = location.pathname.match(/^\/u\/([^/]+)\/?$/)?.[1] ?? new URLSearchParams(location.search).get('profile');
if (publicProfileId !== null) {
  document.querySelector('meta[name="playfeed-auth-bootstrap"]').remove();
  document.querySelector('#profile-actions').hidden = true;
  document.querySelector('#backup-note').hidden = true;
  document.querySelector('#phuze-inline-widget').remove();
  document.querySelector('.identity h1').textContent = '遊戲清單';
  document.querySelector('.identity p').textContent = '';
  document.body.append(document.querySelector('#visitor-login').content.cloneNode(true));
}
</script>
<script src="/auth.js?v=20261118-share-email"></script><script src="/saves.js"></script><script src="/analytics.js"></script><script src="/analytics-owner-link.js" defer></script><script src="/recommendations.js"></script><script src="/catalog.js"></script><script src="/avatar-editor.js"></script>
<script>
let tab=history.state?.collectionTab==='recommended'?'recommended':'saved', collection=null, games=[], loadVersion=0, publicError='';
const isPublic = publicProfileId !== null;
let previewMode = 'developer';
const memberView = () => previewMode !== 'guest' && PlayFeedAuth.user;
try {
 const cached=JSON.parse(sessionStorage.getItem('playfeed:catalog:v1')||'null');
 if(cached&&Date.now()-cached.time<1800000&&Array.isArray(cached.games))games=cached.games.filter(game=>typeof game.id==='string'&&typeof game.url==='string');
} catch {}
const grid=document.querySelector('.grid'), avatar=document.querySelector('.avatar'), title=document.querySelector('.identity h1'), subtitle=document.querySelector('.identity p'), sessionAction=document.querySelector('#session-action');
function render(){
  grid.replaceChildren();
  for (const button of document.querySelectorAll('[data-tab]')) button.classList.toggle('active', button.dataset.tab === tab);
  document.querySelector('#recommend-entry').hidden = isPublic || tab !== 'recommended' || !memberView();
  if (isPublic && !collection) {
    const message = document.createElement('p');
    message.className = 'empty';
    message.textContent = publicError || '正在載入遊戲清單…';
    grid.append(message);
    return;
  }
  const local=isPublic ? [] : PlayFeedSaves.list();
  if(!isPublic&&previewMode!=='guest'&&PlayFeedAuth.checking&&!local.length){const p=document.createElement('p');p.className='empty';p.textContent='正在載入我的頁面…';grid.append(p);return;}
  if(!isPublic&&tab==='recommended'&&!memberView()){const p=document.createElement('p');p.className='empty';p.textContent='認證 Email 後，就能推薦遊戲、查看推薦進度。';grid.append(p);return;}
  if(tab==='recommended'&&!collection){const p=document.createElement('p');p.className='empty';p.textContent='正在載入…';grid.append(p);return;}
  let entries=[];
  if(tab==='recommended') {
    entries=(collection.requests||[]).map(row=>({title:new URL(row.url).hostname,url:row.url,id:row.published_game_id||row.id,status:row.status}));
    for(const row of collection.recommendations){const entry=entries.find(item=>item.url===row.url);if(entry)Object.assign(entry,{title:row.title,id:row.id,status:'approved'});else entries.push({...row,status:isPublic?'':'approved'});}
  }
  else {const keys=new Set([...((previewMode === 'guest' ? null : collection)?.actions||[]).filter(row=>row.kind==='save').map(row=>row.game_key),...local.map(game=>game.url)]);entries=(games.length?games:local).filter(game=>keys.has(new URL(game.url,location.origin+'/').href));}
  for(const game of entries){
    const a=document.createElement('a');a.className='tile';
    const match=games.find(entry=>new URL(entry.url,location.origin).href===new URL(game.url,location.origin).href);
    const preview=match||game;
    a.href=tab==='recommended'?game.url:'/g/'+encodeURIComponent(preview.slug || preview.id)+(isPublic?'':'?list=saved');
    if(tab==='saved'&&!isPublic)a.addEventListener('click',()=>{try{sessionStorage.setItem('playfeed:saved-order:v1',JSON.stringify(entries.map(entry=>new URL(entry.url,location.origin+'/').href)))}catch{}});
    if(tab==='recommended'){a.target='_blank';a.rel='noopener noreferrer';}
    a.setAttribute('aria-label',game.title);
    const img=document.createElement('img');
    img.alt='';img.loading='lazy';img.decoding='async';img.width=390;img.height=700;
    img.referrerPolicy='no-referrer';
    // The thumbnail service returns a cached, non-animated screenshot.
    // No game page or scripts are executed in this grid.
    const screenshot='https://image.thum.io/get/noanimate/width/390/maxAge/168/?url='+encodeURIComponent(new URL(preview.url,location.origin).href);
    const sources=[...new Set([preview.cover,preview.screenshot,screenshot,'/share-cards/'+encodeURIComponent(preview.id)+'.png','/share-cards/default.png'].filter(Boolean))];
    let sourceIndex=0;
    img.addEventListener('error',()=>{sourceIndex++;if(sourceIndex<sources.length)img.src=sources[sourceIndex];else img.remove()});
    img.src=sources[0];a.append(img);
    const span=document.createElement('span');span.textContent=game.title+(game.status?' · '+({pending:'待審核',approved:'已上架',rejected:'暫不上架'}[game.status]||''): '');a.append(span);grid.append(a);
  }
  if(!entries.length){const p=document.createElement('p');p.className='empty';p.textContent=isPublic?'這裡還沒有遊戲。':memberView()&&!collection?'正在載入收藏…':tab==='saved'?'還沒有收藏，回遊戲牆按下儲存，就能在這裡找到。':'這裡還沒有遊戲。';grid.append(p)}
}
function updateBackup(){
 const user=memberView(),note=document.querySelector('#backup-note');
 note.hidden=Boolean(user)&&!PlayFeedSaves.error;
 document.querySelector('#phuze-inline-widget').hidden=Boolean(user);
 document.querySelector('#backup-copy').textContent=previewMode === 'guest' ? '' : PlayFeedSaves.error||'';
 document.querySelector('#backup-copy').hidden=previewMode === 'guest'||!PlayFeedSaves.error;
 document.querySelector('#backup-action').hidden=!user||!PlayFeedSaves.error;
 if(!user){document.querySelector('.profile-site')?.remove();title.textContent='我的收藏';avatar.textContent='☆';subtitle.textContent='此瀏覽器已儲存 '+PlayFeedSaves.list().length+' 款遊戲'}
}
window.addEventListener('playfeed:saves-change',event=>{if(isPublic)return;updateBackup();render();if(event.detail.reason==='merged'&&PlayFeedAuth.user&&collection)loadCollection()});
document.querySelector('#backup-action').addEventListener('click',async()=>{if(memberView()){await PlayFeedSaves.merge();updateBackup()}else PlayFeedAuth.openLogin()});
function showAvatar(target, profile) {
  target.textContent = Array.from(profile.display_name)[0]?.toUpperCase() || '?';
  if (profile.avatar) {
    const image = new Image();
    image.alt = '';
    image.src = profile.avatar;
    target.replaceChildren(image);
  }
}
function showIdentity(profile) {
  title.textContent=profile.display_name;subtitle.textContent=profile.bio||'我的遊戲收藏';
  showAvatar(avatar, profile);
  document.querySelector('.profile-site')?.remove();
  if(profile.website){const link=document.createElement('a');link.className='profile-site';link.href=profile.website;link.textContent=profile.website;link.target='_blank';link.rel='noopener noreferrer';document.querySelector('.identity').append(link)}
}
function updateFollowButton() {
  const followButton = document.querySelector('#follow-profile');
  const following = Boolean(collection?.following);
  followButton.textContent = following ? '已追蹤' : '追蹤';
  followButton.setAttribute('aria-pressed', String(following));
}

async function loadPublicCollection() {
  const version = ++loadVersion;
  try {
    const result = await PlayFeedAuth.api('/api/account?action=public-profile&profile=' + encodeURIComponent(publicProfileId));
    if (version !== loadVersion) return;
    collection = result;
    showIdentity(result.profile);
    document.title = result.profile.display_name + '的遊戲清單 | FanGame';
    document.querySelector('#visitor-actions').hidden = result.isOwn;
    updateFollowButton();
  } catch (error) {
    if (version !== loadVersion) return;
    if (collection) document.querySelector('#follow-status').textContent = error.message;
    else publicError = error.message;
  }
  render();
}
const dismissedNotices = new Set();
function renderNotifications() {
  const notifications = document.querySelector('#notifications');
  notifications.replaceChildren();
  if (!memberView() || !collection) return;
  for (const item of collection.notifications) {
    if (dismissedNotices.has(item.id)) continue;
    const notice = document.createElement('div');
    notice.className = 'publication-notice';
    const link = document.createElement('a');
    const recommendation = collection.recommendations.find(row => row.id === item.game_id);
    const listed = recommendation && games.find(game => new URL(game.url, location.origin).href === recommendation.url);
    link.href = '/g/' + encodeURIComponent(listed?.slug || listed?.id || item.game_id);
    link.textContent = '你的推薦「' + item.title + '」已上架！';
    if (!item.read_at) link.className = 'unread';
    link.addEventListener('click', () => accountAction({action:'read-notifications'}).catch(() => {}));
    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'notice-close';
    close.textContent = '×';
    close.setAttribute('aria-label', '關閉「' + item.title + '」上架通知');
    close.addEventListener('click', async () => {
      close.disabled = true;
      try {
        await accountAction({action:'dismiss-notification', id:item.id});
        dismissedNotices.add(item.id);
        const next = notice.nextElementSibling?.querySelector('button') ||
          notice.previousElementSibling?.querySelector('button') || document.querySelector('#share-profile');
        if (notice.isConnected && document.activeElement === close) next.focus();
        notice.remove();
      } catch (error) {
        close.disabled = false;
        status.textContent = error.message;
      }
    });
    const status = document.createElement('p');
    status.className = 'notice-status';
    status.setAttribute('role', 'status');
    notice.append(link, close, status);
    notifications.append(notice);
  }
  const pending = collection.requests.filter(row => row.status === 'pending').length;
  if (pending) {
    const message = document.createElement('p');
    message.textContent = pending + ' 款推薦等待管理者審核。';
    notifications.append(message);
  }
}

function applyPreview() {
  document.body.dataset.memberPreview = previewMode;
  document.querySelector('#preview-modes').hidden = !collection?.isAdmin;
  for (const button of document.querySelectorAll('[data-mode]')) {
    button.setAttribute('aria-pressed', String(button.dataset.mode === previewMode));
  }
  const showMember = Boolean(memberView() && collection);
  document.querySelector('#edit-profile').hidden = !showMember;
  document.querySelector('#open-following').hidden = !showMember;
  if (showMember) showIdentity(collection.profile);
  updateBackup();
  renderNotifications();
  render();
}

for (const button of document.querySelectorAll('[data-mode]')) {
  button.addEventListener('click', () => {
    if (!collection?.isAdmin) return;
    previewMode = button.dataset.mode;
    applyPreview();
  });
}
// Keep the real session intact while previewing the guest Email form.
document.addEventListener('submit', event => {
  if (previewMode !== 'guest' || !event.target.closest('#phuze-inline-widget')) return;
  event.preventDefault();
  event.stopImmediatePropagation();
}, true);

async function loadCollection(){
 const version=++loadVersion;
 try{
  await PlayFeedSaves.merge();
  const result=PlayFeedAuth.takeCollection?.()||await PlayFeedAuth.api('/api/account?action=collection');
  if(version!==loadVersion||!PlayFeedAuth.user)return;
  collection=result;
  applyPreview();
  resumeShareAfterLogin();
  document.querySelector('#reports-entry').hidden=!result.isAdmin;
  document.querySelector('#waiting-entry').hidden=result.user?.id!=='d28b1149fa6dc857b3086bf77acf5073'||String(result.user?.email||'').toLowerCase()!=='paulvongulla@gmail.com';
  document.querySelector('#open-review').hidden=!result.isAdmin;
  if(!result.isAdmin)document.querySelector('#review').hidden=true;
  else if(new URLSearchParams(location.search).get('review')==='1'){document.querySelector('#review').hidden=false;document.querySelector('#open-review').setAttribute('aria-expanded','true')}
  if(result.isAdmin){loadReview();PlayFeedAuth.api('/api/account?action=reports').then(data=>{if(version!==loadVersion||!collection?.isAdmin)return;const count=data.reports.filter(r=>r.status==='pending').length;document.querySelector('#reports-entry a').textContent='查看遊戲檢舉（'+count+' 筆待處理）'}).catch(()=>{})}
  render();
 }catch(error){if(version!==loadVersion)return;const p=document.createElement('p');p.className='empty';p.textContent=error.message;grid.replaceChildren(p)}
}
for(const button of document.querySelectorAll('[data-tab]'))button.addEventListener('click',()=>{tab=button.dataset.tab;history.replaceState({...history.state,collectionTab:tab},'');render()});
sessionAction.addEventListener('click',async()=>{if(PlayFeedAuth.user)await PlayFeedAuth.logout();else PlayFeedAuth.openLogin()});
PlayFeedAuth.onChange(async user=>{sessionAction.textContent=user?'登出':'Email 認證';sessionAction.hidden=!user||isPublic;if(isPublic){loadPublicCollection();return}avatar.textContent=user?.email?.[0]?.toUpperCase()||'?';title.textContent=user?.email?.split('@')[0]||'我的頁面';subtitle.textContent=user?.email||'認證 Email，同步收藏與推薦';loadVersion++;collection=null;previewMode='developer';document.body.dataset.memberPreview=previewMode;document.querySelector('#preview-modes').hidden=true;dismissedNotices.clear();if(!user)document.querySelector('#share-dialog').close();document.querySelector('#following-dialog').close();document.querySelector('#reports-entry').hidden=true;document.querySelector('.profile-site')?.remove();document.querySelector('#notifications').replaceChildren();document.querySelector('#review').hidden=true;document.querySelector('#open-review').hidden=true;document.querySelector('#open-review').setAttribute('aria-expanded','false');document.querySelector('#review-list').replaceChildren();document.querySelector('#profile-dialog').close();document.querySelector('#edit-profile').hidden=true;document.querySelector('#open-following').hidden=true;updateBackup();render();if(user)loadCollection()});
PlayFeedAuth.onChange(()=>{document.querySelector('#waiting-entry').hidden=true;});
loadPlayfeedGames().then(value=>{games=value;PlayFeedSaves.refreshMetadata?.(games);try{sessionStorage.setItem('playfeed:catalog:v1',JSON.stringify({time:Date.now(),games}))}catch{}render();if(!isPublic)renderNotifications()});

const profileDialog=document.querySelector('#profile-dialog'),profileForm=document.querySelector('#profile-form');
const avatarEditor = createAvatarEditor();
profileDialog.addEventListener('close', () => avatarEditor.reset());
document.querySelector('#edit-profile').addEventListener('click',()=>{
 if(!collection)return;
 profileForm.elements.displayName.value=collection.profile.display_name;
 profileForm.elements.bio.value=collection.profile.bio;
 profileForm.elements.website.value=collection.profile.website;
 avatarEditor.reset(collection.profile.avatar);
 document.querySelector('#profile-status').textContent='';profileDialog.showModal();
});
document.querySelector('#cancel-profile').addEventListener('click',()=>profileDialog.close());
profileForm.addEventListener('submit',async event=>{
 event.preventDefault();const button=profileForm.querySelector('[type=submit]');button.disabled=true;
 try{await PlayFeedAuth.api('/api/account',{method:'POST',body:JSON.stringify({action:'profile',displayName:profileForm.elements.displayName.value,bio:profileForm.elements.bio.value,website:profileForm.elements.website.value,avatar:avatarEditor.value()})});profileDialog.close();await loadCollection()}
 catch(error){document.querySelector('#profile-status').textContent=error.message}finally{button.disabled=false}
});
document.querySelector('#open-review').addEventListener('click',()=>{document.querySelector('#review').hidden=false;document.querySelector('#open-review').setAttribute('aria-expanded','true');loadReview();document.querySelector('#review').scrollIntoView({block:'start'})});
document.querySelector('#close-review').addEventListener('click',()=>{document.querySelector('#review').hidden=true;document.querySelector('#open-review').setAttribute('aria-expanded','false');history.replaceState(null,'',location.pathname);document.querySelector('#open-review').focus()});
async function loadReview(){
 try{
 const result=await PlayFeedAuth.api('/api/account?action=review');
 if(!collection?.isAdmin)return;
 document.querySelector('#open-review').textContent='待審核（'+result.requests.length+'）';
 const list=document.querySelector('#review-list');list.replaceChildren();
 for(const request of result.requests){
  const row=document.createElement('div');row.className='review-row';
  const a=document.createElement('a');a.href=request.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=request.url;row.append(a);
  const preview=document.createElement('a');preview.href='/submit.html?request='+encodeURIComponent(request.id)+'&game='+encodeURIComponent(request.url);preview.textContent='預覽試玩與審核';preview.className='button';row.append(preview);
  for(const [decision,label]of[['reject','不予上架']]){
   const button=document.createElement('button');button.className='button';button.textContent=label;
   button.addEventListener('click',async()=>{row.querySelectorAll('button').forEach(b=>b.disabled=true);try{await PlayFeedAuth.api('/api/account',{method:'POST',body:JSON.stringify({action:'review',requestId:request.id,decision})});await loadCollection()}catch(error){const status=document.createElement('p');status.textContent=error.message;row.append(status);row.querySelectorAll('button').forEach(b=>b.disabled=false)}});row.append(button)
  }
  list.append(row)
 }
 if(!result.requests.length)list.textContent='目前沒有待審核推薦。';
 }catch(error){document.querySelector('#review-list').textContent=error.message}
}
</script>
