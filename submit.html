<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>推薦新遊戲 · PlayFeed</title>
<style>body{max-width:640px;margin:auto;padding:28px 20px;background:#101014;color:#faf8f2;font:16px system-ui}a{color:inherit}label{display:block;margin:24px 0}input{box-sizing:border-box;width:100%;display:block;margin-top:10px;padding:14px;background:#25252d;color:inherit;border:1px solid #555;border-radius:12px;font:inherit}button{padding:12px 20px;border:0;border-radius:12px;background:#d6fb65;color:#101014;font:inherit;cursor:pointer}button:disabled{opacity:.5}#message{line-height:1.7}dialog{width:min(360px,calc(100% - 48px));background:#19191f;color:inherit;border:1px solid #555;border-radius:20px;padding:24px}dialog::backdrop{background:#000b}#phuze-widget{margin:18px 0}</style>
<a href="/">← 回遊戲牆</a><h1>推薦新遊戲</h1><p id="intro">發現好玩的網頁遊戲？貼上網址推薦給我們，審核上架後會通知你。</p>
<form id="recommend"><label>遊戲網址<input name="url" type="url" placeholder="https://" required maxlength="1000"></label><button type="submit">送出推薦</button></form>
<p id="message" role="status" aria-live="polite"></p><p><a href="/account.html">查看我的推薦與通知</a></p>
<dialog id="login-dialog"><h2>登入 PlayFeed</h2><p>登入後即可推薦遊戲。</p><div id="phuze-widget"></div><button type="button" data-close-login>取消</button></dialog>
<script src="https://phuze.edato.me/phuze.js"></script><script src="/auth.js"></script>
<script>
const form=document.querySelector('#recommend'),message=document.querySelector('#message'),button=form.querySelector('button');
form.addEventListener('submit',event=>{
 event.preventDefault();
 PlayFeedAuth.requireLogin(async()=>{
  button.disabled=true;message.textContent='送出中…';
  try{
   const result=await PlayFeedAuth.api('/api/account',{method:'POST',body:JSON.stringify({action:'recommend',url:form.elements.url.value})});
   if(result.status==='published'){location.assign('/#'+encodeURIComponent(result.id));return}
   message.textContent=result.message;form.reset();
  }catch(error){message.textContent=error.message}finally{button.disabled=false}
 });
});
PlayFeedAuth.onChange(async user=>{
 if(!user)return;
 try{const me=await PlayFeedAuth.api('/api/account?action=me');if(me.isAdmin){document.querySelector('#intro').textContent='管理者推薦的遊戲會直接上架。';button.textContent='上架遊戲'}}catch{}
});
const selected=new URLSearchParams(location.search).get('game');if(selected)form.elements.url.value=selected;
</script></html>
