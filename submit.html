<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>推薦遊戲 · FanGame</title>
<style>body{max-width:640px;margin:auto;padding:24px 24px calc(80px + env(safe-area-inset-bottom));background:#101014;color:#faf8f2;font:16px system-ui}a{color:inherit}label{display:block;margin:24px 0}input[type=url]{width:100%;box-sizing:border-box;padding:14px;font:inherit}button{padding:12px;background:#d6fb65;border:0;border-radius:10px;cursor:pointer}iframe{background:#000;width:100%;height:700px;max-height:75dvh;border:0}dialog{background:#202029;color:white}button:disabled{opacity:.5}button{background:#ffad66;color:#402815;font:700 15px system-ui;min-height:44px}button:hover{background:#ffc18e}button:focus-visible,a:focus-visible{outline:2px solid #ffb46c;outline-offset:3px}.form-actions{display:flex;gap:10px;flex-wrap:wrap}.secondary{background:#2b2b33;color:#faf8f2;border:1px solid #66616c}.secondary:hover{background:#3c3841}input[type=url]{border:1px solid #665c51;border-radius:10px;background:#25252d;color:#faf8f2}input::placeholder{color:#b6adb9}.game-link{display:inline-flex;align-items:center;padding:12px 18px;background:#ffad66;color:#402815;border-radius:10px;font-weight:700;text-decoration:none}.game-link:hover{background:#ffc18e}.game-link[hidden]{display:none}
.submit-back-bar{position:fixed;z-index:8;left:50%;bottom:0;transform:translateX(-50%);box-sizing:border-box;width:min(462px,100%);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #dcc6ae;background:#fff7eb;box-shadow:0 -3px 16px #0002}
.submit-back-bar a{display:grid;place-items:center;width:clamp(96px,33vw,144px);min-height:48px;border-radius:13px;background:#d63f20;color:#fff;font:750 15px system-ui;text-decoration:none}
.submit-back-bar a:hover{background:#c53518}
</style>
<h1>推薦新遊戲</h1><p id="intro">貼上遊戲網址送出推薦，等待管理員預覽審核；上架後會通知你。</p>
<form id="recommend"><label>遊戲網址<input name="url" type="url" placeholder="https://" required maxlength="1000"></label><div class="form-actions"><button type="submit">送出推薦</button><button type="button" class="secondary" id="cancel-recommend">取消</button></div></form><p id="message" role="status"></p><p><a id="existing-game" class="game-link" hidden>前往遊戲</a></p><a href="/account.html">查看我的推薦與通知</a>
<section id="preview" hidden><h2>預覽試玩</h2><p>請實際操作遊戲，確認在此畫面可以互動；空白或無法互動的網址請暫不上架。</p><div id="player"></div><p><a id="external" data-external-game target="_blank" rel="noopener noreferrer">另開原網站</a></p><form id="publish"><label><input name="confirmed" type="checkbox" required> 我已在上方試玩，確認可以互動</label><button type="submit">確認上架</button></form><p id="review-actions" hidden><button type="button" id="reject-review">不予上架</button> <a href="/account.html?review=1">返回待審核</a></p></section>
<nav class="submit-back-bar" aria-label="推薦頁面導覽"><a id="back-to-previous" href="/account.html">回上一頁</a></nav>
<dialog id="login-dialog"><h2>Email 認證</h2><div id="phuze-widget"></div><button type="button" data-close-login>取消</button></dialog><script src="/game-preview-crop.js"></script><script src="/game-screenshot.js"></script><script src="/game-frame.js?v=20261118-sandbox"></script><script src="/external-game-link.js" defer></script><script src="/auth.js?v=20261114-collection-note"></script><script src="/analytics.js?v=20261118-device-continuity"></script><script>
const form=document.querySelector('#recommend'),message=document.querySelector('#message'),button=form.querySelector('button'),preview=document.querySelector('#preview'),publish=document.querySelector('#publish'),player=document.querySelector('#player');
const params=new URLSearchParams(location.search);let currentUrl=null,admin=false,revision=0,identity=0,screenshot=null,screenshotFocus=null;
const backLink = document.querySelector('#back-to-previous');
if (params.has('request')) backLink.href = '/account.html?review=1';
backLink.addEventListener('click', event => {
  if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  if (window.navigation?.canGoBack ?? Boolean(document.referrer && history.length > 1)) {
    event.preventDefault();
    history.back();
  }
});
const shot=PlayFeedScreenshot.mount(preview,()=>{const current=revision;return {frame:player.querySelector('iframe'),isCurrent:()=>current===revision&&admin,title:'遊戲預覽',onSave:async (image,focus)=>{screenshot=image;screenshotFocus=focus;shot.querySelector('button').textContent='截圖（已選好）';}}});player.after(shot);
const existingGame=document.querySelector('#existing-game');
function showExisting(result){resetPreview();message.textContent=result.message;existingGame.href='/g/'+encodeURIComponent(result.id);existingGame.textContent='前往遊戲：'+(result.title||'已上架的遊戲');existingGame.hidden=false;}
function resetPreview(){screenshot=null;screenshotFocus=null;shot.querySelector('button').textContent='截圖';existingGame.hidden=true;existingGame.removeAttribute('href');document.querySelector('#review-actions').hidden=true;revision++;currentUrl=null;preview.hidden=true;player.replaceChildren();publish.reset();}
document.querySelector('#cancel-recommend').addEventListener('click',()=>{resetPreview();form.reset();location.assign(admin&&params.get('request')?'/account.html?review=1':'/account.html')});
function showPreview(url){resetPreview();currentUrl=url;const frame=document.createElement('iframe');frame.title='遊戲試玩';frame.src=PlayFeedFrame.configure(frame,url);player.append(frame);document.querySelector('#external').href=url;preview.hidden=false;document.querySelector('#review-actions').hidden=!(admin&&params.get('request'));message.textContent='試玩完成並確認能互動後，再按確認上架。';}
form.addEventListener('input',resetPreview);
form.addEventListener('submit',event=>{event.preventDefault();PlayFeedAuth.requireLogin(async()=>{button.disabled=true;message.textContent='處理中…';const version=revision;try{const result=await PlayFeedAuth.api('/api/account',{method:'POST',body:JSON.stringify({action:'recommend',url:form.elements.url.value})});if(version!==revision)return;if(result.status==='existing'){showExisting(result);return;}if(result.status==='preview'){showPreview(result.url);return;}window.PlayFeedAnalytics?.event('recommend_success');message.textContent=result.message||'已加入我的推薦，等待管理員審核。';form.reset();}catch(error){message.textContent=error.message}finally{button.disabled=false}})});
publish.addEventListener('submit',event=>{event.preventDefault();if(!currentUrl||!admin||!publish.elements.confirmed.checked)return;PlayFeedAuth.requireLogin(async()=>{const submit=publish.querySelector('button');submit.disabled=true;message.textContent='正在擷取首畫面並上架，請稍候…';const version=revision;try{const requestId=params.get('request');const body=requestId?{action:'review',requestId,decision:'approve',interactionConfirmed:true}:{action:'publish',url:currentUrl,interactionConfirmed:true};body.screenshot=screenshot;body.screenshotFocus=screenshotFocus;const result=await PlayFeedAuth.api('/api/account',{method:'POST',timeoutMs:115000,body:JSON.stringify(body)});if(version!==revision)return;if(result.status==='existing'){showExisting(result);return;}if(result.id)location.assign('/#'+encodeURIComponent(result.id));else location.assign('/account.html?review=1');}catch(error){message.textContent=error.message}finally{submit.disabled=false}})});
PlayFeedAuth.onChange(async user=>{const version=++identity;admin=false;resetPreview();button.textContent='送出推薦';document.querySelector('#intro').textContent='貼上遊戲網址送出推薦，等待管理員預覽審核；上架後會通知你。';if(!user)return;try{const me=await PlayFeedAuth.api('/api/account?action=me');if(version!==identity)return;admin=me.isAdmin;if(admin){button.textContent='預覽試玩';document.querySelector('#intro').textContent='先預覽試玩，確認可以互動後，再手動上架。';if(params.get('request')){publish.querySelector('button').textContent='\u540c\u610f\u4e26\u4e0a\u67b6';document.querySelector('#review-actions').hidden=false;const review=await PlayFeedAuth.api('/api/account?action=review');if(version!==identity)return;const request=review.requests.find(row=>row.id===params.get('request'));if(request){form.elements.url.value=request.url;form.elements.url.readOnly=true;showPreview(request.url)}else message.textContent='這筆推薦已處理或不存在。';}}}catch(error){message.textContent=error.message}});
if(params.get('game'))form.elements.url.value=params.get('game');
document.querySelector('#reject-review').addEventListener('click',async()=>{if(!admin||!params.get('request'))return;const reject=document.querySelector('#reject-review');reject.disabled=true;try{await PlayFeedAuth.api('/api/account',{method:'POST',body:JSON.stringify({action:'review',requestId:params.get('request'),decision:'reject'})});location.assign('/account.html?review=1')}catch(error){message.textContent=error.message}finally{reject.disabled=false}});
</script></html>
