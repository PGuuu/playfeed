<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>推薦遊戲 · PlayFeed</title>
<style>body{max-width:640px;margin:auto;padding:24px;background:#101014;color:#faf8f2;font:16px system-ui}a{color:inherit}label{display:block;margin:24px 0}input[type=url]{width:100%;box-sizing:border-box;padding:14px;font:inherit}button{padding:12px;background:#d6fb65;border:0;border-radius:10px;cursor:pointer}iframe{width:100%;height:700px;max-height:75dvh;border:0}dialog{background:#202029;color:white}button:disabled{opacity:.5}</style>
<a href="/">← 回遊戲牆</a><h1>推薦新遊戲</h1><p id="intro">貼上網址，加入自己的推薦筆記，同時送交管理員審核。上架後會通知你。</p>
<form id="recommend"><label>遊戲網址<input name="url" type="url" placeholder="https://" required maxlength="1000"></label><button type="submit">送出推薦</button></form><p id="message" role="status"></p><a href="/account.html">查看我的推薦與通知</a>
<section id="preview" hidden><h2>預覽試玩</h2><p>請實際操作遊戲，確認在此畫面可以互動；空白或無法互動的網址請暫不上架。</p><div id="player"></div><p><a id="external" target="_blank" rel="noopener noreferrer">另開原網站</a></p><form id="publish"><label><input name="confirmed" type="checkbox" required> 我已在上方試玩，確認可以互動</label><button type="submit">確認上架</button></form><p id="review-actions" hidden><button type="button" id="reject-review">不予上架</button> <a href="/account.html?review=1">返回待審核</a></p></section>
<dialog id="login-dialog"><h2>Email 認證</h2><div id="phuze-widget"></div><button type="button" data-close-login>取消</button></dialog><script src="/game-frame.js"></script><script src="/auth.js?v=20261114-motion"></script><script src="/analytics.js"></script><script>
const form=document.querySelector('#recommend'),message=document.querySelector('#message'),button=form.querySelector('button'),preview=document.querySelector('#preview'),publish=document.querySelector('#publish'),player=document.querySelector('#player');
const params=new URLSearchParams(location.search);let currentUrl=null,admin=false,revision=0,identity=0;
function resetPreview(){document.querySelector('#review-actions').hidden=true;revision++;currentUrl=null;preview.hidden=true;player.replaceChildren();publish.reset();}
function showPreview(url){resetPreview();currentUrl=url;const frame=document.createElement('iframe');frame.title='遊戲試玩';frame.src=PlayFeedFrame.configure(frame,url);player.append(frame);document.querySelector('#external').href=url;preview.hidden=false;document.querySelector('#review-actions').hidden=!(admin&&params.get('request'));message.textContent='試玩完成並確認能互動後，再按確認上架。';}
form.addEventListener('input',resetPreview);
form.addEventListener('submit',event=>{event.preventDefault();PlayFeedAuth.requireLogin(async()=>{button.disabled=true;message.textContent='處理中…';const version=revision;try{const result=await PlayFeedAuth.api('/api/account',{method:'POST',body:JSON.stringify({action:'recommend',url:form.elements.url.value})});if(version!==revision)return;if(result.status==='preview'){showPreview(result.url);return;}window.PlayFeedAnalytics?.event('recommend_success');message.textContent=result.message||'已加入我的推薦，等待管理員審核。';form.reset();}catch(error){message.textContent=error.message}finally{button.disabled=false}})});
publish.addEventListener('submit',event=>{event.preventDefault();if(!currentUrl||!admin||!publish.elements.confirmed.checked)return;PlayFeedAuth.requireLogin(async()=>{const submit=publish.querySelector('button');submit.disabled=true;try{const requestId=params.get('request');const body=requestId?{action:'review',requestId,decision:'approve',interactionConfirmed:true}:{action:'publish',url:currentUrl,interactionConfirmed:true};const result=await PlayFeedAuth.api('/api/account',{method:'POST',body:JSON.stringify(body)});if(result.id)location.assign('/#'+encodeURIComponent(result.id));else location.assign('/account.html?review=1');}catch(error){message.textContent=error.message}finally{submit.disabled=false}})});
PlayFeedAuth.onChange(async user=>{const version=++identity;admin=false;resetPreview();button.textContent='送出推薦';document.querySelector('#intro').textContent='貼上網址，加入自己的推薦筆記，同時送交管理員審核。上架後會通知你。';if(!user)return;try{const me=await PlayFeedAuth.api('/api/account?action=me');if(version!==identity)return;admin=me.isAdmin;if(admin){button.textContent='預覽試玩';document.querySelector('#intro').textContent='先預覽試玩，確認可以互動後，再手動上架。';if(params.get('request')){document.querySelector('#review-actions').hidden=false;const review=await PlayFeedAuth.api('/api/account?action=review');if(version!==identity)return;const request=review.requests.find(row=>row.id===params.get('request'));if(request){form.elements.url.value=request.url;form.elements.url.readOnly=true;showPreview(request.url)}else message.textContent='這筆推薦已處理或不存在。';}}}catch(error){message.textContent=error.message}});
if(params.get('game'))form.elements.url.value=params.get('game');
document.querySelector('#reject-review').addEventListener('click',async()=>{if(!admin||!params.get('request'))return;const reject=document.querySelector('#reject-review');reject.disabled=true;try{await PlayFeedAuth.api('/api/account',{method:'POST',body:JSON.stringify({action:'review',requestId:params.get('request'),decision:'reject'})});location.assign('/account.html?review=1')}catch(error){message.textContent=error.message}finally{reject.disabled=false}});
</script></html>
