<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>待審遊戲 · PlayFeed</title>
<style>
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#443323;background:#fff7eb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,a{touch-action:manipulation}button,.button{min-height:44px;padding:10px 15px;border:0;border-radius:12px;background:#edc29c;color:#443323;cursor:pointer;text-decoration:none;font-weight:650}button:hover,.button:hover{background:#e5b387}button:disabled{opacity:.45;cursor:default}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #8b542b;outline-offset:3px}[hidden]{display:none!important}header{max-width:1180px;margin:auto;padding:20px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:22px;margin:12px 0 4px}header p{margin:0;font-size:13px;color:#82664b}.intro{max-width:1180px;margin:0 auto;padding:8px 20px}.workspace{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;max-width:1180px;margin:auto;padding:12px 20px 28px}.queue{border:1px solid #e0ccb6;border-radius:18px;padding:14px;align-self:start}.queue h2{font-size:15px;margin:0 0 12px}.queue-list{display:grid;gap:6px;max-height:75dvh;overflow:auto}.queue-list button{text-align:left;font-size:12px;font-weight:500;overflow-wrap:anywhere;background:#f3e6d6}.queue-list button[aria-current=true]{background:#d78e48;color:#fff7eb}.player-column{min-width:0}.nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}.nav span{flex:1;text-align:center;font-size:13px}.player{height:min(700px,72dvh);min-height:300px;border-radius:16px;background:#000;position:relative;overflow:hidden;display:grid;place-items:center}.player iframe{border:0;width:100%;height:100%;background:#000}.player-note{font-size:12px;line-height:1.6;color:#82664b}.details{margin-top:16px;border:1px solid #e0ccb6;border-radius:16px;padding:16px}.details h2{font-size:17px;margin:0 0 12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields label{font-size:12px;display:grid;gap:6px}.fields input{width:100%;min-width:0;padding:10px;border:1px solid #cfb496;border-radius:9px;background:#fffdf8;color:#443323;font-size:16px}.confirm{display:flex;align-items:flex-start;gap:9px;margin:16px 0;line-height:1.6;font-size:13px}.confirm input{width:20px;height:20px;flex:none}.decision{display:flex;gap:8px;flex-wrap:wrap}.publish{background:#79502f;color:#fff7eb;min-width:112px}.publish:hover{background:#593d2a}.secondary{background:#f3e6d6}.status{font-size:14px;line-height:1.6;overflow-wrap:anywhere;min-height:20px}.gate{max-width:600px;margin:30px auto;padding:24px}.orientation{margin-left:auto;display:flex;gap:6px}.orientation button{font-size:12px;padding:8px;min-height:36px}.orientation [aria-pressed=true]{background:#79502f;color:white}.player.landscape{height:min(400px,60dvh)}dialog{border:1px solid #d9c1a6;border-radius:18px;padding:24px;background:#fff7eb;color:#443323;max-width:calc(100vw - 24px)}dialog::backdrop{background:#15191080}#phuze-widget{min-width:min(300px,70vw)}@media(max-width:760px){header{align-items:flex-start}.workspace{display:flex;flex-direction:column;gap:12px;padding:8px 12px 28px}.queue{width:100%;padding:10px}.queue-list{display:flex;overflow:auto;max-height:none;gap:6px}.queue-list button{flex:0 0 150px;max-height:65px;overflow:hidden}.queue h2{margin:0 0 8px}.fields{grid-template-columns:1fr}.player{height:68dvh}header,.intro{padding-left:14px;padding-right:14px}.nav{flex-wrap:wrap}.orientation{margin-left:0}.player-note{margin-top:8px}}
</style></head><body>
<header><div><h1>待審遊戲</h1><p>你的私人試玩區 · 按公開才會出現在遊戲牆</p></div><a class="button" href="/account.html">我的頁面</a></header>
<section id="gate" class="gate"><p id="gate-message" role="status">正在確認帳號…</p><button id="login" hidden>Email 認證</button><button id="retry" hidden>重新載入</button></section>
<p id="flash" class="intro status" role="status"></p>
<main id="workspace" class="workspace" hidden>
 <aside class="queue"><h2>等待公開 <span id="count"></span></h2><div id="queue-list" class="queue-list" aria-label="待審遊戲清單"></div></aside>
 <section class="player-column">
  <nav class="nav" aria-label="試玩切換"><button id="previous">← 上一款</button><span id="position"></span><button id="next">下一款 →</button><div class="orientation"><button id="portrait" aria-pressed="true">直式</button><button id="landscape" aria-pressed="false">橫式</button></div></nav>
  <div id="player" class="player"></div>
  <p class="player-note">請在上方試玩；若空白、拒絕連線或無法操作，可以略過。<a id="original" target="_blank" rel="noopener noreferrer">另開原網站 ↗</a></p>
  <form id="review-form" class="details"><h2 id="game-title">遊戲資料</h2><div class="fields"><label>公開名稱<input name="title" required maxlength="300"></label><label>創作者<input name="author" required maxlength="120"></label></div><p id="metadata-message" class="status" role="status"></p>
   <label class="confirm"><input type="checkbox" name="confirmed" required>我已試玩，確認可以正常操作，並核對遊戲名稱與創作者。</label>
   <div class="decision"><button class="publish" type="submit">公開</button><button id="reject" class="secondary" type="button">略過，不上架</button></div><p id="action-message" class="status" role="status"></p>
  </form>
 </section>
</main>
<dialog id="login-dialog"><h2>Email 認證</h2><div id="phuze-widget"></div><button type="button" data-close-login>取消</button></dialog>
<script src="/game-preview-crop.js"></script><script src="/game-screenshot.js"></script><script src="/game-frame.js"></script><script src="/auth.js?v=20261114-collection-note"></script><script src="/waiting.js"></script>
</body></html>
